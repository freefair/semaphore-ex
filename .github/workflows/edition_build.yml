name: Edition Build

'on':
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      enhanced_revision:
        description: Full semaphorepro-module commit SHA
        required: false
        type: string

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '24.19.0'
  TASK_VERSION: '3.53.1'

jobs:
  community:
    name: Community artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            pro/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json

      - name: Install pinned build tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v"${TASK_VERSION}"
          npm ci --prefix web

      - name: Test Community modules
        run: |
          go test ./... -count=1
          (cd pro && go test ./... -count=1)

      - name: Build Community artifacts twice
        env:
          CORE_REVISION: ${{ github.sha }}
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          task build:edition \
            APP_BUILD_TYPE= \
            CORE_REVISION="$CORE_REVISION" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            OUTPUT_DIR=dist/community-first
          task build:edition \
            APP_BUILD_TYPE= \
            CORE_REVISION="$CORE_REVISION" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            OUTPUT_DIR=dist/community-second
          diff -qr dist/community-first dist/community-second

      - name: Browser smoke Community presentation
        run: |
          npm ci --prefix test/e2e
          npx --prefix test/e2e playwright install --with-deps chromium
          python3 -m http.server 8080 --directory dist/community-first/web &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          (cd test/e2e && EDITION_EXPECTED=community npx playwright test tests/edition.spec.ts)

      - name: Build and smoke Community containers
        env:
          CORE_REVISION: ${{ github.sha }}
        run: |
          docker build \
            --build-arg APP_BUILD_TYPE= \
            --build-arg EDITION=community \
            --build-arg CORE_REVISION="$CORE_REVISION" \
            --tag semaphore-community-server:ci \
            --file deployment/docker/server/Dockerfile .
          docker build \
            --build-arg APP_BUILD_TYPE= \
            --build-arg EDITION=community \
            --build-arg CORE_REVISION="$CORE_REVISION" \
            --tag semaphore-community-runner:ci \
            --file deployment/docker/runner/Dockerfile .
          container_id=$(docker run --rm --detach \
            --publish 3000:3000 \
            --env SEMAPHORE_DB_DIALECT=sqlite \
            --env SEMAPHORE_ADMIN=admin \
            --env SEMAPHORE_ADMIN_PASSWORD=edition-smoke-password \
            --env SEMAPHORE_ADMIN_NAME='Edition Smoke' \
            --env SEMAPHORE_ADMIN_EMAIL=edition-smoke@example.invalid \
            semaphore-community-server:ci)
          trap 'docker stop "$container_id"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/ping >/dev/null; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          curl --fail --silent --cookie-jar /tmp/semaphore-cookie \
            --header 'Content-Type: application/json' \
            --data '{"auth":"admin","password":"edition-smoke-password","method":"password"}' \
            http://127.0.0.1:3000/api/auth/login
          curl --fail --silent --cookie /tmp/semaphore-cookie \
            http://127.0.0.1:3000/api/info | \
            jq --exit-status '.edition == "community" and (.features | type == "object")'
          docker run --rm semaphore-community-runner:ci /usr/local/bin/semaphore version

      - name: Upload Community evidence
        uses: actions/upload-artifact@v7
        with:
          name: community-${{ github.sha }}
          path: |
            dist/community-first
            test/e2e/test-results/community-edition.png
          if-no-files-found: error
          retention-days: 14

  enhanced-ha-resilience:
    name: Enhanced HA resilience contract
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            test/edition-contract/enhanced/go.sum

      - name: Verify HA harness contracts
        run: go test ./test/ha-resilience/... -count=1

      - name: Build Clean-room Enhanced HA images
        run: ./test/ha-resilience/build-clean-room-images.sh

      - name: Run required Enhanced HA fault gate
        env:
          SEMAPHORE_HA_SERVER_A_IMAGE: semaphore-enhanced-server:ha-skew-old
          SEMAPHORE_HA_SERVER_B_IMAGE: semaphore-enhanced-server:ha-candidate
          SEMAPHORE_HA_REPLACEMENT_IMAGE: semaphore-enhanced-server:ha-candidate
          SEMAPHORE_HA_RUNNER_IMAGE: semaphore-enhanced-server:ha-candidate
        run: ./test/ha-resilience/run.sh --report dist/ha-resilience/report.json

      - name: Validate HA result
        if: always()
        run: jq --exit-status '.result == "passed"' dist/ha-resilience/report.json

      - name: Upload Enhanced HA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enhanced-ha-resilience-${{ github.sha }}
          path: dist/ha-resilience/report.json
          if-no-files-found: error
          retention-days: 14

  enhanced:
    name: Enhanced artifacts
    if: >-
      github.event_name != 'pull_request' &&
      (inputs.enhanced_revision != '' || vars.ENHANCED_REVISION != '')
    runs-on: ubuntu-latest
    environment: enhanced-build

    steps:
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned enhanced module
        uses: actions/checkout@v7
        with:
          repository: semaphoreui/semaphorepro-module
          ref: ${{ inputs.enhanced_revision || vars.ENHANCED_REVISION }}
          token: ${{ secrets.ENHANCED_REPOSITORY_TOKEN }}
          path: pro_impl
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            pro_impl/go.sum

      - name: Verify enhanced revision and workspace
        env:
          EXPECTED_REVISION: ${{ inputs.enhanced_revision || vars.ENHANCED_REVISION }}
        run: |
          actual_revision=$(git -C pro_impl rev-parse HEAD)
          test "$actual_revision" = "$EXPECTED_REVISION"
          go work init . ./pro_impl

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json

      - name: Install pinned build tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v"${TASK_VERSION}"
          npm ci --prefix web

      - name: Test enhanced module pair
        run: |
          go test ./... -count=1
          (cd pro_impl && go test ./... -count=1)

      - name: Build Enhanced artifacts twice
        env:
          CORE_REVISION: ${{ github.sha }}
        run: |
          enhanced_revision=$(git -C pro_impl rev-parse HEAD)
          source_date_epoch=$(git show -s --format=%ct HEAD)
          task build:edition \
            APP_BUILD_TYPE=pro_selfhosted \
            CORE_REVISION="$CORE_REVISION" \
            ENHANCED_REVISION="$enhanced_revision" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            OUTPUT_DIR=dist/enhanced-first
          task build:edition \
            APP_BUILD_TYPE=pro_selfhosted \
            CORE_REVISION="$CORE_REVISION" \
            ENHANCED_REVISION="$enhanced_revision" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            OUTPUT_DIR=dist/enhanced-second
          diff -qr dist/enhanced-first dist/enhanced-second

      - name: Browser smoke Enhanced presentation
        run: |
          npm ci --prefix test/e2e
          npx --prefix test/e2e playwright install --with-deps chromium
          python3 -m http.server 8080 --directory dist/enhanced-first/web &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          (cd test/e2e && EDITION_EXPECTED=enhanced npx playwright test tests/edition.spec.ts)

      - name: Build and smoke Enhanced containers
        env:
          CORE_REVISION: ${{ github.sha }}
        run: |
          enhanced_revision=$(git -C pro_impl rev-parse HEAD)
          docker build \
            --build-arg APP_BUILD_TYPE=pro_selfhosted \
            --build-arg EDITION=enhanced \
            --build-arg CORE_REVISION="$CORE_REVISION" \
            --build-arg ENHANCED_REVISION="$enhanced_revision" \
            --tag semaphore-enhanced-server:ci \
            --file deployment/docker/server/Dockerfile .
          docker build \
            --build-arg APP_BUILD_TYPE=pro_selfhosted \
            --build-arg EDITION=enhanced \
            --build-arg CORE_REVISION="$CORE_REVISION" \
            --build-arg ENHANCED_REVISION="$enhanced_revision" \
            --tag semaphore-enhanced-runner:ci \
            --file deployment/docker/runner/Dockerfile .
          container_id=$(docker run --rm --detach \
            --publish 3000:3000 \
            --env SEMAPHORE_DB_DIALECT=sqlite \
            --env SEMAPHORE_ADMIN=admin \
            --env SEMAPHORE_ADMIN_PASSWORD=edition-smoke-password \
            --env SEMAPHORE_ADMIN_NAME='Edition Smoke' \
            --env SEMAPHORE_ADMIN_EMAIL=edition-smoke@example.invalid \
            semaphore-enhanced-server:ci)
          trap 'docker stop "$container_id"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/ping >/dev/null; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          curl --fail --silent --cookie-jar /tmp/semaphore-cookie \
            --header 'Content-Type: application/json' \
            --data '{"auth":"admin","password":"edition-smoke-password","method":"password"}' \
            http://127.0.0.1:3000/api/auth/login
          curl --fail --silent --cookie /tmp/semaphore-cookie \
            http://127.0.0.1:3000/api/info | \
            jq --exit-status '.edition == "enhanced" and (.features | type == "object")'
          docker run --rm semaphore-enhanced-runner:ci /usr/local/bin/semaphore version

      - name: Upload Enhanced evidence
        uses: actions/upload-artifact@v7
        with:
          name: enhanced-${{ github.sha }}
          path: |
            dist/enhanced-first
            test/e2e/test-results/enhanced-edition.png
          if-no-files-found: error
          retention-days: 14
