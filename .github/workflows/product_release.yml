name: Full Product Release

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-ex.[0-9]+'

permissions:
  contents: read

env:
  GO_VERSION: '1.26.8'
  NODE_VERSION: '24.19.0'
  TASK_VERSION: '3.53.1'

jobs:
  gate:
    name: Release gate
    uses: ./.github/workflows/product_build.yml
    permissions:
      contents: read
    with:
      base_ref: HEAD^

  release:
    name: Signed archives and packages
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup golang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v"${TASK_VERSION}"

      - name: Install rpm
        run: |
          sudo apt update && sudo apt-get install rpm

      - name: Install deps
        run: |
          task deps

      - name: Import gnupg
        run: |
          echo "${{ secrets.GPG_KEY_3 }}" | tr " " "\n" | base64 -d | gpg --import --batch
          echo "${{ secrets.GPG_KEY_3 }}" | tr " " "\n" | base64 -d > "$RUNNER_TEMP/gpg.key"
          gpg --sign -u "${{ vars.GPG_KEY_ID_3 }}" --pinentry-mode loopback --yes --batch --passphrase "${{ secrets.GPG_PASS_3 }}" --output unlock.sig --detach-sign README.md
          rm -f unlock.sig

      - name: Reset repo
        run: |
          git reset --hard

      - name: Release notes
        run: |
          task release:notes OUTPUT="$RUNNER_TEMP/release-notes.md"

      - name: Run release
        run: |
          GITHUB_TOKEN=${{ github.token }} \
          GORELEASER_CURRENT_TAG="${{ github.ref_name }}" \
          GPG_PASS_3="${{ secrets.GPG_PASS_3 }}" \
          GPG_KEY_ID_3="${{ vars.GPG_KEY_ID_3 }}" \
          GPG_KEY_PATH="$RUNNER_TEMP/gpg.key" \
          NFPM_SEMAPHORE_PASSPHRASE="${{ secrets.GPG_PASS_3 }}" \
          PROJECT_NAME=semaphore-ex \
            task release:prod GORELEASER_ARGS="--release-notes $RUNNER_TEMP/release-notes.md"

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs:
      - gate
      - release
    permissions:
      contents: read
      packages: write

    env:
      SERVER_IMAGE: ghcr.io/freefair/semaphore-ex
      RUNNER_IMAGE: ghcr.io/freefair/semaphore-ex-runner

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup qemu
        uses: docker/setup-qemu-action@v4

      - name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server meta
        id: server
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SERVER_IMAGE }}
          labels: |
            org.opencontainers.image.title=Semaphore EX
            org.opencontainers.image.vendor=freefair
            maintainer=Semaphore EX <semaphore-ex@freefair.io>
          tags: |
            type=raw,value=${{ github.ref_name }}
          flavor: |
            latest=true

      - name: Server build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          build-args: |
            CORE_REVISION=${{ github.sha }}
            ENHANCED_REVISION=${{ github.sha }}
            SOURCE_TAG=${{ github.ref_name }}
          file: deployment/docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.server.outputs.labels }}
          tags: ${{ steps.server.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Runner meta
        id: runner
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.RUNNER_IMAGE }}
          labels: |
            org.opencontainers.image.title=Semaphore EX runner
            org.opencontainers.image.vendor=freefair
            maintainer=Semaphore EX <semaphore-ex@freefair.io>
          tags: |
            type=raw,value=${{ github.ref_name }}
          flavor: |
            latest=true

      - name: Runner build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          build-args: |
            CORE_REVISION=${{ github.sha }}
            ENHANCED_REVISION=${{ github.sha }}
            SOURCE_TAG=${{ github.ref_name }}
          file: deployment/docker/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.runner.outputs.labels }}
          tags: ${{ steps.runner.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
