name: Full Product Release

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-ex.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-ex.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-ex.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  GO_VERSION: '1.26.8'
  NODE_VERSION: '24.19.0'
  TASK_VERSION: '3.53.1'
  GORELEASER_VERSION: '2.11.2'

jobs:
  gate:
    name: Reuse verified commit
    uses: ./.github/workflows/release_gate.yml
    permissions:
      contents: read
      actions: read

  release:
    name: Signed archives and packages
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup golang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install pinned release tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v"${TASK_VERSION}"
          go install github.com/goreleaser/goreleaser/v2@v"${GORELEASER_VERSION}"

      - name: Install rpm
        run: |
          sudo apt update && sudo apt-get install rpm

      - name: Install application dependencies
        run: |
          task deps:image

      - name: Import gnupg
        run: |
          echo "${{ secrets.GPG_KEY_3 }}" | tr " " "\n" | base64 -d | gpg --import --batch
          echo "${{ secrets.GPG_KEY_3 }}" | tr " " "\n" | base64 -d > "$RUNNER_TEMP/gpg.key"
          gpg --sign -u "${{ vars.GPG_KEY_ID_3 }}" --pinentry-mode loopback --yes --batch --passphrase "${{ secrets.GPG_PASS_3 }}" --output unlock.sig --detach-sign README.md
          rm -f unlock.sig

      - name: Reset repo
        run: |
          git reset --hard

      - name: Release notes
        run: |
          task release:notes OUTPUT="$RUNNER_TEMP/release-notes.md"

      - name: Run release
        run: |
          GITHUB_TOKEN=${{ github.token }} \
          GORELEASER_CURRENT_TAG="${{ github.ref_name }}" \
          GPG_PASS_3="${{ secrets.GPG_PASS_3 }}" \
          GPG_KEY_ID_3="${{ vars.GPG_KEY_ID_3 }}" \
          GPG_KEY_PATH="$RUNNER_TEMP/gpg.key" \
          NFPM_SEMAPHORE_PASSPHRASE="${{ secrets.GPG_PASS_3 }}" \
          PROJECT_NAME=semaphore-ex \
            task release:prod GORELEASER_ARGS="--release-notes $RUNNER_TEMP/release-notes.md"

  server:
    name: Server image
    needs: gate
    uses: ./.github/workflows/release_image.yml
    permissions:
      contents: read
      packages: write
    with:
      kind: server
      tag: ${{ github.ref_name }}
      publish: true

  runner:
    name: Runner image
    needs: gate
    uses: ./.github/workflows/release_image.yml
    permissions:
      contents: read
      packages: write
    with:
      kind: runner
      tag: ${{ github.ref_name }}
      publish: true

  promote:
    name: Promote verified images to latest
    runs-on: ubuntu-latest
    needs: [release, server, runner]
    permissions:
      contents: read
      packages: write
    env:
      SERVER_IMAGE: ghcr.io/freefair/semaphore-ex
      RUNNER_IMAGE: ghcr.io/freefair/semaphore-ex-runner
      SERVER_DIGEST: ${{ needs.server.outputs.digest }}
      RUNNER_DIGEST: ${{ needs.runner.outputs.digest }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact multi-architecture digests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SERVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RUNNER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$SERVER_IMAGE:latest" "$SERVER_IMAGE@$SERVER_DIGEST"
          docker buildx imagetools create --tag "$RUNNER_IMAGE:latest" "$RUNNER_IMAGE@$RUNNER_DIGEST"
          test "$(docker buildx imagetools inspect "$SERVER_IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$SERVER_DIGEST"
          test "$(docker buildx imagetools inspect "$RUNNER_IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$RUNNER_DIGEST"
