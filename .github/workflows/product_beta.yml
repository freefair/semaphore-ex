name: Full Product Beta

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-ex.[0-9]+-rc[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-ex.[0-9]+-beta[0-9]+'
  # Manual runs are dry runs: the same gate, a signed goreleaser snapshot that is
  # uploaded as a workflow artifact instead of a release, and image builds without push.
  workflow_dispatch:

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  GO_VERSION: '1.26.8'
  NODE_VERSION: '24.19.0'
  TASK_VERSION: '3.53.1'
  GORELEASER_VERSION: '2.11.2'

jobs:
  gate:
    name: Reuse verified commit
    uses: ./.github/workflows/release_gate.yml
    permissions:
      contents: read
      actions: read

  release:
    name: Signed archives and packages
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup golang
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install pinned release tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v"${TASK_VERSION}"
          go install github.com/goreleaser/goreleaser/v2@v"${GORELEASER_VERSION}"

      - name: Install rpm
        run: |
          sudo apt update && sudo apt-get install rpm

      - name: Install application dependencies
        run: |
          task deps:image

      - name: Import gnupg
        run: |
          echo "${{ secrets.GPG_KEY_3 }}" | tr " " "\n" | base64 -d | gpg --import --batch
          echo "${{ secrets.GPG_KEY_3 }}" | tr " " "\n" | base64 -d > "$RUNNER_TEMP/gpg.key"
          gpg --sign -u "${{ vars.GPG_KEY_ID_3 }}" --pinentry-mode loopback --yes --batch --passphrase "${{ secrets.GPG_PASS_3 }}" --output unlock.sig --detach-sign README.md
          rm -f unlock.sig

      - name: Reset repo
        run: |
          git reset --hard

      - name: Release notes
        if: env.DRY_RUN != 'true'
        run: |
          task release:notes OUTPUT="$RUNNER_TEMP/release-notes.md"

      - name: Run release
        if: env.DRY_RUN != 'true'
        run: |
          GITHUB_TOKEN=${{ github.token }} \
          GORELEASER_CURRENT_TAG="${{ github.ref_name }}" \
          GPG_PASS_3="${{ secrets.GPG_PASS_3 }}" \
          GPG_KEY_ID_3="${{ vars.GPG_KEY_ID_3 }}" \
          GPG_KEY_PATH="$RUNNER_TEMP/gpg.key" \
          NFPM_SEMAPHORE_PASSPHRASE="${{ secrets.GPG_PASS_3 }}" \
          PROJECT_NAME=semaphore-ex \
            task release:prod GORELEASER_ARGS="--release-notes $RUNNER_TEMP/release-notes.md"

      - name: Mark the draft as a pre-release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft --prerelease

      - name: Build a signed snapshot without publishing
        if: env.DRY_RUN == 'true'
        run: |
          GPG_PASS_3="${{ secrets.GPG_PASS_3 }}" \
          GPG_KEY_ID_3="${{ vars.GPG_KEY_ID_3 }}" \
          GPG_KEY_PATH="$RUNNER_TEMP/gpg.key" \
          NFPM_SEMAPHORE_PASSPHRASE="${{ secrets.GPG_PASS_3 }}" \
          PROJECT_NAME=semaphore-ex \
            task release:prod GORELEASER_ARGS="--snapshot --skip=publish --clean"

      - name: Upload snapshot artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-${{ github.sha }}
          path: |
            bin/*.tar.gz
            bin/*.zip
            bin/*.deb
            bin/*.rpm
            bin/*checksums.txt*
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server image
    needs: gate
    uses: ./.github/workflows/release_image.yml
    permissions:
      contents: read
      packages: write
    with:
      kind: server
      tag: ${{ github.ref_name }}
      publish: ${{ github.event_name != 'workflow_dispatch' }}

  runner:
    name: Runner image
    needs: gate
    uses: ./.github/workflows/release_image.yml
    permissions:
      contents: read
      packages: write
    with:
      kind: runner
      tag: ${{ github.ref_name }}
      publish: ${{ github.event_name != 'workflow_dispatch' }}
