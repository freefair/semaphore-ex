# Fork-owned API definitions and paths, referenced by api-docs.yml.
definitions:
  DeploymentWindowOverride:
    type: object
    required:
    - category
    - reference
    additionalProperties: false
    properties:
      category:
        type: string
        enum:
        - incident
        - security
        - customer_impact
      reference:
        type: string
        maxLength: 128
        pattern: ^[A-Z0-9]{2,16}-[1-9][0-9]{0,9}$
        example: INC-41
  DeploymentWindowRule:
    type: object
    required:
    - id
    - revision
    - name
    - active
    - kind
    - scope
    - recurrence
    - duration_minutes
    additionalProperties: false
    properties:
      id:
        type: integer
        minimum: 0
        description: Zero creates a new rule; positive IDs identify existing immutable rule history.
      revision:
        type: integer
        minimum: 1
      name:
        type: string
        maxLength: 255
      active:
        type: boolean
      kind:
        type: string
        enum:
        - allow
        - freeze
      scope:
        type: string
        enum:
        - project
        - template
        - workflow
      template_id:
        type: integer
        minimum: 1
        description: Required only for template scope.
      workflow_id:
        type: integer
        minimum: 1
        description: Required only for workflow scope.
      recurrence:
        type: string
        maxLength: 255
        description: Standard five-field cron expression evaluated in the policy timezone.
        example: 0 9 * * 1-5
      duration_minutes:
        type: integer
        minimum: 1
        maximum: 1440
      effective_from:
        type: string
        format: date
      effective_until:
        type: string
        format: date
  DeploymentWindowPolicy:
    type: object
    required:
    - project_id
    - revision
    - timezone
    - default
    - rules
    properties:
      project_id:
        type: integer
        minimum: 1
        readOnly: true
      revision:
        type: integer
        minimum: 1
      timezone:
        type: string
        maxLength: 128
        example: Europe/Berlin
      default:
        type: string
        enum:
        - allow
        - deny
      rules:
        type: array
        maxItems: 64
        items:
          $ref: ./api-docs.yml#/definitions/DeploymentWindowRule
  DeploymentWindowPolicyRequest:
    type: object
    required:
    - revision
    - timezone
    - default
    - rules
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
      timezone:
        type: string
        maxLength: 128
      default:
        type: string
        enum:
        - allow
        - deny
      rules:
        type: array
        maxItems: 64
        items:
          $ref: ./api-docs.yml#/definitions/DeploymentWindowRule
  DeploymentWindowDecision:
    type: object
    required:
    - state
    - reason
    - next_eligible_known
    properties:
      state:
        type: string
        enum:
        - allowed
        - blocked
        - overridden
      reason:
        type: string
        enum:
        - allow_window
        - freeze_active
        - default_allow
        - default_deny
        - override
      next_eligible_at:
        type: string
        format: date-time
      next_eligible_known:
        type: boolean
      provenance:
        $ref: ./api-docs.yml#/definitions/DeploymentWindowDecisionProvenance
  DeploymentWindowDecisionProvenance:
    type: object
    properties:
      policy_revision:
        type: integer
        minimum: 1
      effective_timezone:
        type: string
      evaluated_at:
        type: string
        format: date-time
      matched_rule_ids:
        type: array
        maxItems: 64
        items:
          type: integer
          minimum: 1
      override_actor_id:
        type: integer
        minimum: 1
  DeploymentWindowHistoryEntry:
    type: object
    required:
    - id
    - source
    - origin
    - decision
    - created_at
    properties:
      id:
        type: integer
        minimum: 1
      source:
        type: string
        enum:
        - manual
        - schedule
        - api
        - webhook
        - workflow_node
        - integration
        - autorun
      origin:
        type: string
        enum:
        - user
        - schedule
        - workflow_trigger
        - workflow_node
        - integration
        - autorun
      template_id:
        type: integer
        minimum: 1
      workflow_id:
        type: integer
        minimum: 1
      schedule_id:
        type: integer
        minimum: 1
      task_id:
        type: integer
        minimum: 1
      workflow_run_id:
        type: integer
        minimum: 1
      workflow_run_node_id:
        type: integer
        minimum: 1
      decision:
        $ref: ./api-docs.yml#/definitions/DeploymentWindowDecision
      created_at:
        type: string
        format: date-time
paths:
  /project/{project_id}/deployment-windows:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    get:
      tags:
      - deployment-window
      summary: Get the versioned project deployment-window policy
      responses:
        200:
          description: Current policy
          schema:
            $ref: ./api-docs.yml#/definitions/DeploymentWindowPolicy
        403:
          description: Project resource-management permission required
        503:
          description: Deployment-window governance unavailable
    put:
      tags:
      - deployment-window
      summary: Replace the project deployment-window policy using its current revision
      parameters:
      - name: policy
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/DeploymentWindowPolicyRequest
      responses:
        200:
          description: Saved policy with the next revision
          schema:
            $ref: ./api-docs.yml#/definitions/DeploymentWindowPolicy
        400:
          description: Invalid timezone, recurrence, range, scope, target, or request shape
        403:
          description: Project resource-management permission required
        409:
          description: Policy revision conflict; reload before retrying
        503:
          description: Deployment-window governance unavailable
    delete:
      tags:
      - deployment-window
      summary: Reset the project deployment-window policy
      parameters:
      - name: expected_revision
        in: query
        required: true
        type: integer
        minimum: 1
      responses:
        204:
          description: Policy reset to the default allow policy
        400:
          description: Invalid expected revision
        403:
          description: Project resource-management permission required
        409:
          description: Policy revision conflict; reload before retrying
  /project/{project_id}/deployment-windows/preview:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    post:
      tags:
      - deployment-window
      summary: Evaluate an unsaved policy draft for one project-owned target
      description: Exactly one of template_id or workflow_id is required. Evaluation uses database time and never
        exercises the emergency-override path.
      parameters:
      - name: preview
        in: body
        required: true
        schema:
          allOf:
          - $ref: ./api-docs.yml#/definitions/DeploymentWindowPolicyRequest
          - type: object
            properties:
              template_id:
                type: integer
                minimum: 1
              workflow_id:
                type: integer
                minimum: 1
      responses:
        200:
          description: Draft decision with manager-only bounded provenance
          schema:
            $ref: ./api-docs.yml#/definitions/DeploymentWindowDecision
        400:
          description: Invalid policy or target shape
        403:
          description: Target start permission required
        404:
          description: Target is hidden or outside the project
  /project/{project_id}/deployment-windows/status:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    get:
      tags:
      - deployment-window
      summary: Evaluate the saved policy for one project-owned target
      description: Exactly one of template_id or workflow_id is required. The response intentionally omits policy
        and matched-rule provenance.
      parameters:
      - name: template_id
        in: query
        required: false
        type: integer
        minimum: 1
      - name: workflow_id
        in: query
        required: false
        type: integer
        minimum: 1
      responses:
        200:
          description: Coarse current decision
          schema:
            $ref: ./api-docs.yml#/definitions/DeploymentWindowDecision
        400:
          description: Missing, duplicate, or ambiguous target
        403:
          description: Target start permission required
        404:
          description: Target is hidden or outside the project
  /project/{project_id}/deployment-windows/history:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    get:
      tags:
      - deployment-window
      summary: List immutable project deployment-window decisions
      parameters:
      - name: count
        in: query
        required: false
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      - name: before
        in: query
        required: false
        type: integer
        minimum: 1
        description: Return decisions with an ID lower than this cursor.
      responses:
        200:
          description: Newest decisions first
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/DeploymentWindowHistoryEntry
        400:
          description: Invalid pagination
        403:
          description: Project resource-management permission required
