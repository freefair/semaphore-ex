version: 2
dist: bin

before:
  hooks:
    - task build:fe

builds:
  - binary: semaphore
    env:
      - CGO_ENABLED=0
    main: ./cli/main.go
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: -s -w -X github.com/semaphoreui/semaphore/util.Ver={{ .Version }} -X github.com/semaphoreui/semaphore/util.Commit={{ .ShortCommit }} -X github.com/semaphoreui/semaphore/util.Date={{ .Env.SOURCE_DATE_EPOCH }} -X github.com/semaphoreui/semaphore/util.BuildEdition={{ .Env.BUILD_EDITION }} -X github.com/semaphoreui/semaphore/util.CoreRevision={{ .Env.CORE_REVISION }} -X github.com/semaphoreui/semaphore/util.EnhancedRevision={{ .Env.ENHANCED_REVISION }} -X github.com/semaphoreui/semaphore/util.EditionImplementation={{ .Env.EDITION_IMPLEMENTATION }}
    tags:
      - netgo
    goos:
      - windows
      - darwin
      - linux
      - freebsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - ppc64le
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: 386
      - goos: freebsd
        goarch: ppc64le
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64le
      - goos: windows
        goarch: ppc64le
      - goos: windows
        goarch: arm

archives:
  - files:
      - LICENSE
    name_template: "{{ .Env.PROJECT_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

signs:
  -
    artifacts: checksum
    signature: "{{ .Env.PROJECT_NAME }}_{{ .Version }}_checksums.txt.sig"
    cmd: gpg
    stdin: '{{ .Env.GPG_PASS_3 }}'
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "-u"
      - "{{ .Env.GPG_KEY_ID_3 }}"
      - "--yes"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

checksum:
  name_template: "{{ .Env.PROJECT_NAME }}_{{ .Version }}_checksums.txt"

snapshot:
  name_template: "{{ .Timestamp }}-{{ .ShortCommit }}-SNAPSHOT"

nfpms:
  - id: semaphore
    file_name_template: "{{ .Env.PROJECT_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    package_name: "semaphore-ex"
    description: Semaphore EX - full-featured fork of Semaphore UI for Ansible, Terraform, OpenTofu, PowerShell and other DevOps tools.
    homepage: https://github.com/freefair/semaphore-ex
    vendor: freefair
    maintainer: Semaphore EX <semaphore-ex@freefair.io>
    license: MIT

    formats:
      - deb
      - rpm

    dependencies:
      - git

    suggests:
      - ansible

    # The upstream package installs the same /usr/bin/semaphore binary.
    conflicts:
      - semaphore

    bindir: /usr/bin

    # Embedded RPM signature (rpm -K). Skipped when GPG_KEY_PATH is not set
    # (e.g. local `task release:test`). Passphrase comes from the
    # NFPM_SEMAPHORE_PASSPHRASE environment variable.
    rpm:
      signature:
        key_file: '{{ envOrDefault "GPG_KEY_PATH" "" }}'

changelog:
  # Release notes come from the CHANGELOG.md section selected by `task release:notes`.
  disable: true

release:
  draft: true
  use_existing_draft: true
  # Release candidates set GORELEASER_PRERELEASE=true; final releases set it to false.
  prerelease: '{{ envOrDefault "GORELEASER_PRERELEASE" "auto" }}'
  name_template: "Semaphore EX {{ .Tag }}"
