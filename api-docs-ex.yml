      responses:
        200:
          description: Updated trigger with safe key IDs and generations
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowTrigger
        403:
          description: Workflow administration permission required
        409:
          description: Stale revision or next key is not staged
  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/webhook-signing/revoke:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/trigger_id
    post:
      tags:
      - workflow
