      - name: revision
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/WorkflowTriggerRevisionRequest
      responses:
        200:
          description: Updated trigger and one-time next signing secret
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowTriggerCredentialResult
        403:
          description: Workflow administration permission required
        409:
          description: Stale revision, occupied next-key slot, or encryption unavailable
  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/webhook-signing/promote:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/trigger_id
    post:
      tags:
