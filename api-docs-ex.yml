# Fork-owned API definitions and paths, referenced by api-docs.yml.
definitions:
  ExecutionPreflightPlan:
    type: object
    required:
    - contract_version
    - intent
    - project_id
    - actor_id
    - definition
    - fingerprint
    - expires_at
    properties:
      contract_version:
        type: integer
        enum:
        - 1
      intent:
        type: string
        enum:
        - task
        - workflow
      project_id:
        type: integer
      actor_id:
        type: integer
      template_id:
        type: integer
      workflow_id:
        type: integer
      definition:
        type: object
        properties:
          kind:
            type: string
          id:
            type: integer
          name:
            type: string
          revision:
            type: string
          fingerprint:
            type: string
      inputs:
        type: array
        maxItems: 128
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
            source:
              type: string
            present:
              type: boolean
            sensitive:
              type: boolean
      references:
        type: array
        maxItems: 256
        items:
          type: object
          properties:
            kind:
              type: string
            id:
              type: integer
            name:
              type: string
            binding_target:
              type: string
            visible:
              type: boolean
            reason:
              type: string
      commands:
        type: array
        maxItems: 128
        description: Value-free command shapes; argument and input values are omitted.
        items:
          type: object
      placements:
        type: array
        maxItems: 128
        description: Provisional runner selections with at most 100 redacted candidates each.
        items:
          type: object
      findings:
        type: array
        maxItems: 128
        items:
          type: object
          properties:
            severity:
              type: string
              enum:
              - info
              - warning
              - denial
            code:
              type: string
            message:
              type: string
      fingerprint:
        type: string
      expires_at:
        type: string
        format: date-time
      review_token:
        type: string
        description: Opaque short-lived review binding; it is not execution authority.
  ExecutionPreflightStale:
    type: object
    properties:
      code:
        type: string
        enum:
        - stale_execution_preflight
        - execution_preflight_denied
      changes:
        type: array
        maxItems: 16
        items:
          type: string
      preflight:
        $ref: ./api-docs.yml#/definitions/ExecutionPreflightPlan
  PolicyGuardrailDraft:
    type: object
    required:
    - scope
    - source_yaml
    - revision
    - updated_by
    - created
    - updated
    properties:
      scope:
        type: string
        enum:
        - global
        - project
      project_id:
        type: integer
        minimum: 1
      source_yaml:
        type: string
        maxLength: 65536
      revision:
        type: integer
        minimum: 1
      active_revision:
        type: integer
        minimum: 1
      updated_by:
        type: integer
        minimum: 1
      created:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time
  PolicyGuardrailRevision:
    type: object
    required:
    - id
    - scope
    - revision
    - source_yaml
    - fingerprint
    - compiler_version
    - published_by
    - created
    properties:
      id:
        type: integer
        minimum: 1
      scope:
        type: string
        enum:
        - global
        - project
      project_id:
        type: integer
        minimum: 1
      revision:
        type: integer
        minimum: 1
      parent_revision:
        type: integer
        minimum: 1
      rollback_of_revision:
        type: integer
        minimum: 1
      rollback_reason:
        type: string
        maxLength: 512
      source_yaml:
        type: string
        maxLength: 65536
      fingerprint:
        type: string
        pattern: ^sha256:[a-f0-9]{64}$
      compiler_version:
        type: integer
        minimum: 1
      published_by:
        type: integer
        minimum: 1
      created:
        type: string
        format: date-time
  PolicyGuardrailState:
    type: object
    required:
    - draft
    properties:
      draft:
        $ref: ./api-docs.yml#/definitions/PolicyGuardrailDraft
      active:
        $ref: ./api-docs.yml#/definitions/PolicyGuardrailRevision
  PolicyGuardrailDraftRequest:
    type: object
    additionalProperties: false
    required:
    - source_yaml
    - expected_revision
    properties:
      source_yaml:
        type: string
        maxLength: 65536
      expected_revision:
        type: integer
        minimum: 1
  PolicyGuardrailSourceRequest:
    type: object
    additionalProperties: false
    required:
    - source_yaml
    properties:
      source_yaml:
        type: string
        maxLength: 65536
  PolicyGuardrailValidation:
    type: object
    required:
    - valid
    - rule_count
    - issues
    properties:
      valid:
        type: boolean
      fingerprint:
        type: string
        pattern: ^sha256:[a-f0-9]{64}$
      rule_count:
        type: integer
        minimum: 0
        maximum: 32
      issues:
        type: array
        items:
          type: object
          properties:
            code:
              type: string
            path:
              type: string
            message:
              type: string
  PolicyGuardrailEvaluationInput:
    type: object
    additionalProperties: false
    required:
    - project_id
    - intent
    - evaluated_at
    - environment_ids
    - runner
    - executor
    - credentials
    properties:
      project_id:
        type: integer
        minimum: 1
      intent:
        type: string
        enum:
        - task
        - workflow
      evaluated_at:
        type: string
        format: date-time
      template:
        type: object
        description: Value-free task template identity and shape metadata.
      inventory:
        type: object
        description: Value-free inventory identity and shape metadata.
      environment_ids:
        type: array
        maxItems: 256
        items:
          type: integer
          minimum: 1
      workflow:
        type: object
        description: Value-free workflow, revision, node, and trigger metadata.
      runner:
        type: object
        description: Value-free requested and provisional runner placement metadata.
      executor:
        type: object
        description: Executor and image-reference metadata without credentials or mutable values.
      credentials:
        type: array
        maxItems: 256
        items:
          type: object
          required:
          - id
          - scope
          - binding_target
          properties:
            id:
              type: integer
              minimum: 1
            scope:
              type: string
            binding_target:
              type: string
  PolicyGuardrailEvaluation:
    type: object
    required:
    - revisions
    - findings
    - allowed
    - input_fingerprint
    - evaluated_at
    properties:
      revisions:
        type: array
        maxItems: 2
        items:
          type: object
          properties:
            scope:
              type: string
              enum:
              - global
              - project
            project_id:
              type: integer
              minimum: 1
            revision:
              type: integer
              minimum: 1
            fingerprint:
              type: string
      findings:
        type: array
        maxItems: 64
        items:
          type: object
          properties:
            scope:
              type: string
              enum:
              - global
              - project
            revision:
              type: integer
              minimum: 1
            rule_id:
              type: string
            effect:
              type: string
              enum:
              - allow
              - warn
              - deny
            severity:
              type: string
              enum:
              - info
              - low
              - medium
              - high
              - critical
            message:
              type: string
            remediation_url:
              type: string
              format: uri
            node_id:
              type: integer
              minimum: 1
      allowed:
        type: boolean
      input_fingerprint:
        type: string
      evaluated_at:
        type: string
        format: date-time
  PolicyGuardrailFixtureRequest:
    type: object
    additionalProperties: false
    required:
    - input
    properties:
      source_yaml:
        type: string
        maxLength: 65536
      input:
        $ref: ./api-docs.yml#/definitions/PolicyGuardrailEvaluationInput
  PolicyGuardrailImpactRequest:
    type: object
    additionalProperties: false
    required:
    - inputs
    properties:
      inputs:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: ./api-docs.yml#/definitions/PolicyGuardrailEvaluationInput
  PolicyGuardrailImpact:
    type: object
    required:
    - evaluations
    - allowed
    - denied
    properties:
      evaluations:
        type: array
        maxItems: 100
        items:
          $ref: ./api-docs.yml#/definitions/PolicyGuardrailEvaluation
      allowed:
        type: integer
        minimum: 0
      denied:
        type: integer
        minimum: 0
  PolicyGuardrailPublishRequest:
    type: object
    additionalProperties: false
    required:
    - expected_draft_revision
    properties:
      expected_draft_revision:
        type: integer
        minimum: 1
  PolicyGuardrailRollbackRequest:
    type: object
    additionalProperties: false
    required:
    - revision
    - expected_draft_revision
    - reason
    properties:
      revision:
        type: integer
        minimum: 1
      expected_draft_revision:
        type: integer
        minimum: 1
      reason:
        type: string
        minLength: 1
        maxLength: 512
  PolicyGuardrailDiff:
    type: object
    required:
    - from_revision
    - to_revision
    - added
    - removed
    - changed
    properties:
      from_revision:
        type: integer
        minimum: 1
      to_revision:
        type: integer
        minimum: 1
      added:
        type: array
        items:
          type: string
      removed:
        type: array
        items:
          type: string
      changed:
        type: array
        items:
          type: string
  PolicyGuardrailEvaluationRecord:
    type: object
    required:
    - id
    - project_id
    - intent
    - source
    - input_fingerprint
    - decision
    - evaluated_at
    - created
    properties:
      id:
        type: integer
        minimum: 1
      project_id:
        type: integer
        minimum: 1
      intent:
        type: string
        enum:
        - task
        - workflow
      source:
        type: string
      template_id:
        type: integer
        minimum: 1
      workflow_template_id:
        type: integer
        minimum: 1
      workflow_run_id:
        type: integer
        minimum: 1
      workflow_run_node_id:
        type: integer
        minimum: 1
      task_id:
        type: integer
        minimum: 1
      input_fingerprint:
        type: string
      decision:
        type: string
        enum:
        - allow
        - deny
      evaluated_at:
        type: string
        format: date-time
      created:
        type: string
        format: date-time
  GeneratedSSHKeyMetadata:
    type: object
    required:
    - public_key
    - fingerprint
    - algorithm
    properties:
      public_key:
        type: string
        description: Public key in authorized_keys-compatible OpenSSH format.
      fingerprint:
        type: string
        description: OpenSSH SHA-256 public-key fingerprint.
      algorithm:
        type: string
        enum:
        - ed25519
        - rsa-3072
  GeneratedSSHKeyCreateRequest:
    type: object
    required:
    - name
    additionalProperties: false
    properties:
      name:
        type: string
      login:
        type: string
      algorithm:
        type: string
        default: ed25519
        enum:
        - ed25519
        - rsa-3072
  GeneratedSSHKeyRotateRequest:
    type: object
    required:
    - confirm_rotation
    additionalProperties: false
    properties:
      algorithm:
        type: string
        default: ed25519
        enum:
        - ed25519
        - rsa-3072
      confirm_rotation:
        type: boolean
        enum:
        - true
  GeneratedSSHKeyResponse:
    type: object
    required:
    - key
    - public_key
    - fingerprint
    - algorithm
    properties:
      key:
        $ref: ./api-docs.yml#/definitions/AccessKey
      public_key:
        type: string
        description: Public key in authorized_keys-compatible OpenSSH format.
      fingerprint:
        type: string
        description: OpenSSH SHA-256 public-key fingerprint.
      algorithm:
        type: string
        enum:
        - ed25519
        - rsa-3072
  RunnerAttempt:
    type: object
    properties:
      id:
        type: integer
      project_id:
        type: integer
      task_id:
        type: integer
      generation:
        type: integer
      runner_id:
        type: integer
      runner_name:
        type: string
      assigned_at:
        type: string
        format: date-time
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      outcome:
        type: string
        enum:
        - active
        - requeued
        - succeeded
        - failed
        - stopped
      reason:
        type: string
      requested_tags:
        type: array
        items:
          type: string
      match_mode:
        type: string
        enum:
        - all
        - any
      placement_reason:
        type: string
      requested_executor_image:
        type: string
      resolved_executor_image:
        type: string
  TaskSummary:
    type: object
    description: Persisted, normalized Ansible result summary. Available in the enhanced edition.
    required:
    - version
    - task_id
    - project_id
    - runner_result_version
    - state
    - task_status
    - expected_hosts
    - total_hosts
    - ok_hosts
    - failed_hosts
    - event_count
    - updated
    properties:
      version:
        type: integer
        description: Server-side summary schema version
      task_id:
        type: integer
      project_id:
        type: integer
      runner_result_version:
        type: integer
        description: Version of the runner event contract
      state:
        type: string
        enum:
        - collecting
        - complete
        - partial
        - empty
        - unsupported
      task_status:
        type: string
      expected_hosts:
        type: integer
      total_hosts:
        type: integer
      ok_hosts:
        type: integer
      failed_hosts:
        type: integer
      event_count:
        type: integer
      diagnostic:
        type: string
      started_at:
        type: string
        format: date-time
        x-nullable: true
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      updated:
        type: string
        format: date-time
  TaskSummaryHost:
    type: object
    properties:
      id:
        type: integer
      host:
        type: string
      status:
        type: string
        enum:
        - success
        - failed
      changed:
        type: integer
      failed:
        type: integer
      ignored:
        type: integer
      ok:
        type: integer
      rescued:
        type: integer
      skipped:
        type: integer
      unreachable:
        type: integer
      started_at:
        type: string
        format: date-time
        x-nullable: true
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      duration_ms:
        type: integer
        format: int64
  TaskSummaryStage:
    type: object
    properties:
      id:
        type: integer
      stage_id:
        type: string
      stage:
        type: string
      ok:
        type: integer
      changed:
        type: integer
      failed:
        type: integer
      ignored:
        type: integer
      rescued:
        type: integer
      skipped:
        type: integer
      unreachable:
        type: integer
      started_at:
        type: string
        format: date-time
        x-nullable: true
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      duration_ms:
        type: integer
        format: int64
  TaskSummaryError:
    type: object
    properties:
      id:
        type: integer
      event_id:
        type: string
      host:
        type: string
      stage:
        type: string
      status:
        type: string
        enum:
        - failed
        - unreachable
      error:
        type: string
        description: Bounded error text with common secret-bearing values redacted
      output_time:
        type: string
        format: date-time
        x-nullable: true
  TaskSummaryHostPage:
    type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/TaskSummaryHost
      next_cursor:
        type: integer
        x-nullable: true
  TaskSummaryStagePage:
    type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/TaskSummaryStage
      next_cursor:
        type: integer
        x-nullable: true
  TaskSummaryErrorPage:
    type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/TaskSummaryError
      next_cursor:
        type: integer
        x-nullable: true
  WorkflowRunDefinition:
    type: object
    description: Immutable graph presentation data for a workflow run; execution and resource configuration is not
      exposed.
    properties:
      id:
        type: integer
      name:
        type: string
      definition_version:
        type: integer
      revision:
        type: integer
      nodes:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/WorkflowRunDefinitionNode
      edges:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/WorkflowRunDefinitionEdge
  WorkflowRunDefinitionNode:
    type: object
    properties:
      id:
        type: integer
      template_id:
        type: integer
      display_name:
        type: string
      kind:
        type: string
        enum:
        - task
        - approval
        - note
      convergence_mode:
        type: string
        enum:
        - all
        - any
      approval_timeout:
        type: integer
      approval_message:
        type: string
      note:
        type: string
      position_x:
        type: integer
      position_y:
        type: integer
  WorkflowRunDefinitionEdge:
    type: object
    properties:
      id:
        type: integer
      source_node_id:
        type: integer
      destination_node_id:
        type: integer
      condition:
        type: string
        enum:
        - on_success
        - on_failure
        - always
      label:
        type: string
  WorkflowRunTemplate:
    type: object
    description: Template identity needed to label the immutable run graph.
    properties:
      id:
        type: integer
      name:
        type: string
  WorkflowRunTask:
    type: object
    description: Task identity and status needed by the workflow run view.
    properties:
      id:
        type: integer
      status:
        type: string
      used_runner_id:
        type: integer
      used_runner_name:
        type: string
  WorkflowRunNode:
    type: object
    properties:
      id:
        type: integer
      project_id:
        type: integer
      workflow_run_id:
        type: integer
      workflow_node_id:
        type: integer
      template_id:
        type: integer
      status:
        type: string
        enum:
        - pending
        - queued
        - running
        - succeeded
        - failed
        - stopped
        - blocked
      task_id:
        type: integer
      reason:
        type: string
      template:
        $ref: ./api-docs.yml#/definitions/Template
      created:
        type: string
        format: date-time
      queued:
        type: string
        format: date-time
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
  WorkflowFileArtifactAccessPolicy:
    type: object
    additionalProperties: false
    required:
    - revision
    properties:
      revision:
        type: integer
        minimum: 1
      role_ids:
        type: array
        maxItems: 32
        description: Optional current-role allow-list that can only narrow workflow-run visibility.
        items:
          type: string
          maxLength: 64
  WorkflowFileArtifactCredentialProvenance:
    type: object
    description: Value-free credential reference captured from the producing task attempt.
    required:
    - credential_id
    - grant_id
    - credential_version
    - version_fingerprint
    - target
    properties:
      credential_id:
        type: integer
        minimum: 1
      grant_id:
        type: integer
        minimum: 1
      credential_version:
        type: integer
        minimum: 1
      version_fingerprint:
        type: string
        pattern: ^[a-f0-9]{64}$
      provider_version:
        type: integer
        minimum: 0
      target:
        type: string
        maxLength: 128
  WorkflowArtifactRetentionSnapshot:
    type: object
    description: Immutable policy provenance and limits captured when the artifact is created.
    required:
    - global_revision
    - retention_seconds
    - max_artifact_bytes
    - max_run_bytes
    properties:
      global_revision:
        type: integer
        minimum: 0
      project_revision:
        type: integer
        minimum: 0
      retention_seconds:
        type: integer
        format: int64
        minimum: 3600
        maximum: 315360000
      max_artifact_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      max_run_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 268435456
  WorkflowFileArtifact:
    type: object
    description: Immutable file metadata and value-free provenance. Binary content is never embedded.
    required:
    - id
    - project_id
    - workflow_template_id
    - workflow_run_id
    - workflow_node_id
    - workflow_definition_revision
    - task_id
    - attempt
    - logical_name
    - filename
    - media_type
    - size_bytes
    - uploaded_bytes
    - sha256
    - state
    - revision
    - producer_user_id
    - producer_template_id
    - producer_version
    - access_policy
    - retention
    - created_at
    properties:
      id:
        type: integer
        minimum: 1
      project_id:
        type: integer
        minimum: 1
      workflow_template_id:
        type: integer
        minimum: 1
      workflow_run_id:
        type: integer
        minimum: 1
      workflow_node_id:
        type: integer
        minimum: 1
      workflow_definition_revision:
        type: integer
        minimum: 1
      task_id:
        type: integer
        minimum: 1
      attempt:
        type: integer
        minimum: 0
      logical_name:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      filename:
        type: string
        minLength: 1
        maxLength: 255
      media_type:
        type: string
        minLength: 3
        maxLength: 128
      size_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      uploaded_bytes:
        type: integer
        format: int64
        minimum: 0
        maximum: 67108864
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}$
      state:
        type: string
        enum:
        - staging
        - available
        - failed
        - expired
        - deleted
      revision:
        type: integer
        minimum: 1
      producer_user_id:
        type: integer
        minimum: 1
      producer_runner_id:
        type: integer
        minimum: 1
      producer_template_id:
        type: integer
        minimum: 1
      producer_version:
        type: string
        minLength: 1
        maxLength: 128
      credential_provenance:
        type: array
        maxItems: 64
        items:
          $ref: ./api-docs.yml#/definitions/WorkflowFileArtifactCredentialProvenance
      access_policy:
        $ref: ./api-docs.yml#/definitions/WorkflowFileArtifactAccessPolicy
      retention:
        $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionSnapshot
      created_at:
        type: string
        format: date-time
      finalized_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      deleted_at:
        type: string
        format: date-time
  WorkflowFileArtifactUpload:
    type: object
    additionalProperties: false
    required:
    - workflow_node_id
    - task_id
    - attempt
    - logical_name
    - filename
    - media_type
    - size_bytes
    - sha256
    - access_policy
    properties:
      workflow_node_id:
        type: integer
        minimum: 1
      task_id:
        type: integer
        minimum: 1
      attempt:
        type: integer
        minimum: 0
      logical_name:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      filename:
        type: string
        minLength: 1
        maxLength: 255
      media_type:
        type: string
        minLength: 3
        maxLength: 128
      size_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}$
      access_policy:
        $ref: ./api-docs.yml#/definitions/WorkflowFileArtifactAccessPolicy
  WorkflowArtifactRetentionPolicy:
    type: object
    description: One immutable published governance revision.
    required:
    - id
    - scope
    - revision
    - retention_seconds
    - max_artifact_bytes
    - max_run_bytes
    - created_by_user_id
    - created_at
    properties:
      id:
        type: integer
        minimum: 1
      scope:
        type: string
        enum:
        - global
        - project
      project_id:
        type: integer
        minimum: 1
      revision:
        type: integer
        minimum: 1
      retention_seconds:
        type: integer
        format: int64
        minimum: 3600
        maximum: 315360000
      max_artifact_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      max_run_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 268435456
      created_by_user_id:
        type: integer
        minimum: 1
      created_at:
        type: string
        format: date-time
  WorkflowArtifactRetentionState:
    type: object
    required:
    - effective
    properties:
      global_policy:
        $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionPolicy
      project_policy:
        $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionPolicy
      effective:
        $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionSnapshot
  WorkflowArtifactRetentionUpdate:
    type: object
    additionalProperties: false
    required:
    - expected_revision
    - retention_seconds
    - max_artifact_bytes
    - max_run_bytes
    properties:
      expected_revision:
        type: integer
        minimum: 0
      retention_seconds:
        type: integer
        format: int64
        minimum: 3600
        maximum: 315360000
      max_artifact_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      max_run_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 268435456
  WebhookSigningStatus:
    type: object
    description: Non-secret current/next signing metadata. A next generation greater than current is staged; a lower
      next generation is the retired predecessor.
    required:
    - signing_revision
    properties:
      current_key_id:
        type: string
        pattern: ^swhkid_[-_A-Za-z0-9]+$
        maxLength: 64
      next_key_id:
        type: string
        pattern: ^swhkid_[-_A-Za-z0-9]+$
        maxLength: 64
      current_generation:
        type: integer
        minimum: 0
      next_generation:
        type: integer
        minimum: 0
      signing_revision:
        type: integer
        minimum: 0
  AuditWebhookSigningSecret:
    type: object
    description: One-time response. The secret is never returned by status or history reads.
    required:
    - secret
    - signing_revision
    properties:
      secret:
        type: string
        format: password
        pattern: ^swhsec_[-_A-Za-z0-9]+$
      current_key_id:
        type: string
      next_key_id:
        type: string
      current_generation:
        type: integer
      next_generation:
        type: integer
      signing_revision:
        type: integer
  AuditWebhookConfigurationInput:
    type: object
    additionalProperties: false
    required:
    - endpoint
    properties:
      endpoint:
        type: string
        format: uri
        description: Absolute HTTPS endpoint without embedded credentials or a fragment.
      credential:
        type: string
        format: password
        maxLength: 4096
        description: Optional write-only legacy Bearer credential. Omit to preserve it or send an empty string to
          remove it.
  AuditWebhookConfiguration:
    type: object
    required:
    - endpoint
    - credential_configured
    - paused
    - signing_revision
    properties:
      endpoint:
        type: string
        format: uri
      credential_configured:
        type: boolean
      paused:
        type: boolean
      updated_at:
        type: string
        format: date-time
      current_key_id:
        type: string
      next_key_id:
        type: string
      current_generation:
        type: integer
      next_generation:
        type: integer
      signing_revision:
        type: integer
  AuditWebhookDelivery:
    type: object
    required:
    - id
    - event_id
    - status
    - attempts
    - created_at
    - updated_at
    properties:
      id:
        type: integer
      event_id:
        type: string
        minLength: 16
        maxLength: 128
      status:
        type: string
        enum:
        - pending
        - delivering
        - retrying
        - succeeded
        - failed
      attempts:
        type: integer
        minimum: 0
      next_attempt:
        type: string
        format: date-time
      http_status:
        type: integer
      last_error:
        type: string
        description: Bounded reason code; never a raw transport error or response body.
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      delivered_at:
        type: string
        format: date-time
  AuditWebhookDeliveryAttempt:
    type: object
    description: Redacted attempt metadata; payloads, credentials, signatures, headers, bodies, and raw errors are
      omitted.
    required:
    - id
    - delivery_id
    - event_id
    - attempt
    - key_id
    - signed_at
    - outcome
    - created_at
    properties:
      id:
        type: integer
      delivery_id:
        type: integer
      event_id:
        type: string
        minLength: 16
        maxLength: 128
      attempt:
        type: integer
        minimum: 1
      key_id:
        type: string
        pattern: ^swhkid_[-_A-Za-z0-9]+$
      signed_at:
        type: string
        format: date-time
      outcome:
        type: string
        enum:
        - started
        - succeeded
        - retrying
        - failed
      http_status:
        type: integer
      reason:
        type: string
        enum:
        - network_error
        - timeout
        - http_4xx
        - http_5xx
        - invalid_response
        - no_key
        - signing_failure
        - configuration_error
        - delivery_failed
      created_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
  WorkflowTriggerInputMapping:
    type: object
    required:
    - parameter
    - source
    properties:
      parameter:
        type: string
      source:
        type: string
        enum:
        - fixed
        - request
      key:
        type: string
      value:
        description: Typed fixed value matching the workflow parameter declaration.
  WorkflowTrigger:
    type: object
    required:
    - id
    - project_id
    - workflow_template_id
    - revision
    - name
    - type
    - owner_user_id
    - enabled
    properties:
      id:
        type: integer
      project_id:
        type: integer
      workflow_template_id:
        type: integer
      revision:
        type: integer
      name:
        type: string
        maxLength: 128
      type:
        type: string
        enum:
        - manual
        - schedule
        - api
        - webhook
      owner_user_id:
        type: integer
      enabled:
        type: boolean
      cron_format:
        type: string
      input_mappings:
        type: array
        maxItems: 64
        items:
          $ref: ./api-docs.yml#/definitions/WorkflowTriggerInputMapping
      credential_generation:
        type: integer
        description: API-trigger credential generation only.
      current_signing_key_id:
        type: string
      next_signing_key_id:
        type: string
      current_signing_generation:
        type: integer
      next_signing_generation:
        type: integer
      created:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time
      last_fired:
        type: string
        format: date-time
      last_result:
        type: string
  WorkflowTriggerMutation:
    type: object
    additionalProperties: false
    required:
    - name
    - type
    - enabled
    properties:
      name:
        type: string
        maxLength: 128
      type:
        type: string
        enum:
        - manual
        - schedule
        - api
        - webhook
      enabled:
        type: boolean
      cron_format:
        type: string
      revision:
        type: integer
      input_mappings:
        type: array
        maxItems: 64
        items:
          $ref: ./api-docs.yml#/definitions/WorkflowTriggerInputMapping
  WorkflowTriggerCredentialResult:
    type: object
    required:
    - trigger
    properties:
      trigger:
        $ref: ./api-docs.yml#/definitions/WorkflowTrigger
      credential:
        type: string
        format: password
        description: One-time `swt_` API-trigger credential.
      webhook_signing_secret:
        type: string
        format: password
        description: One-time `swhsec_` webhook signing secret.
  WorkflowTriggerRevisionRequest:
    type: object
    additionalProperties: false
    required:
    - revision
    properties:
      revision:
        type: integer
        minimum: 1
  WorkflowTriggerInvocationInput:
    type: object
    additionalProperties: false
    properties:
      inputs:
        type: object
        description: Only request keys explicitly mapped by the trigger are accepted.
  WorkflowTriggerHistoryEntry:
    type: object
    description: Safe invocation history without payloads, event hashes, signatures, secrets, headers, input snapshots,
      or internal failure details.
    required:
    - id
    - workflow_trigger_id
    - status
    - created
    - updated
    properties:
      id:
        type: integer
      workflow_trigger_id:
        type: integer
      status:
        type: string
        enum:
        - claimed
        - running
        - succeeded
        - failed
        - rejected
        - blocked
      run_id:
        type: integer
      result:
        type: string
      webhook_event_id:
        type: string
      webhook_key_id:
        type: string
      webhook_signed_at:
        type: string
        format: date-time
      webhook_replay_count:
        type: integer
        minimum: 0
      webhook_last_replayed_at:
        type: string
        format: date-time
      created:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time
  WorkflowTriggerFireResult:
    type: object
    properties:
      invocation:
        type: object
        properties:
          id:
            type: integer
          workflow_trigger_id:
            type: integer
          status:
            type: string
          run_id:
            type: integer
          result:
            type: string
          reason:
            type: string
      run:
        $ref: ./api-docs.yml#/definitions/WorkflowRun
      duplicate:
        type: boolean
  GlobalCredentialExternalReference:
    type: object
    description: Value-free Vault or OpenBao reference. The server stores but does not resolve it in this API layer.
    required:
    - provider
    - provider_id
    - mount
    - path
    - version
    - field
    additionalProperties: false
    properties:
      provider:
        type: string
        enum:
        - vault
        - openbao
      provider_id:
        type: string
        maxLength: 64
      mount:
        type: string
        maxLength: 128
      path:
        type: string
        maxLength: 512
      version:
        type: integer
        minimum: 1
      field:
        type: string
        maxLength: 128
  GlobalCredentialMaterialInput:
    type: object
    description: Write-only material. Supply exactly one of string_value or external_reference. No response returns
      this object.
    additionalProperties: false
    properties:
      string_value:
        type: string
        format: password
        minLength: 1
        maxLength: 4096
      external_reference:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialExternalReference
  GlobalCredentialCreateRequest:
    type: object
    required:
    - type
    - display_name
    - material
    additionalProperties: false
    properties:
      type:
        type: string
        enum:
        - string
      display_name:
        type: string
        minLength: 1
        maxLength: 128
      material:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialMaterialInput
  GlobalCredentialSummary:
    type: object
    description: Least-privilege global view. Material, owner, provider coordinates, and timestamps are omitted.
    required:
    - id
    - type
    - display_name
    - enabled
    - revision
    - current_version
    - fingerprint
    - material_kind
    properties:
      id:
        type: integer
      type:
        type: string
        enum:
        - string
      display_name:
        type: string
      enabled:
        type: boolean
      revision:
        type: integer
        minimum: 1
      current_version:
        type: integer
        minimum: 1
      fingerprint:
        type: string
        description: Random opaque per-version identifier, never a content hash.
        pattern: ^[a-f0-9]{64}$
      material_kind:
        type: string
        enum:
        - local_encrypted
        - external_reference
  GlobalCredentialDetail:
    allOf:
    - $ref: ./api-docs.yml#/definitions/GlobalCredentialSummary
    - type: object
      required:
      - owner_user_id
      - created
      - updated
      properties:
        owner_user_id:
          type: integer
        external_reference:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialExternalReference
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
  GlobalCredentialMetadataUpdateRequest:
    type: object
    required:
    - revision
    - display_name
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
      display_name:
        type: string
        minLength: 1
        maxLength: 128
  GlobalCredentialEnabledRequest:
    type: object
    required:
    - revision
    - enabled
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
      enabled:
        type: boolean
  GlobalCredentialRotateRequest:
    type: object
    required:
    - revision
    - material
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
      material:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialMaterialInput
  GlobalCredentialGrantInput:
    type: object
    required:
    - project_id
    - operations
    additionalProperties: false
    properties:
      project_id:
        type: integer
        minimum: 1
      operations:
        type: integer
        description: Bit mask containing reference (1), consume (2), or both (3).
        enum:
        - 1
        - 2
        - 3
      expires_at:
        type: string
        format: date-time
  GlobalCredentialGrantUpdateRequest:
    allOf:
    - $ref: ./api-docs.yml#/definitions/GlobalCredentialGrantInput
    - type: object
      required:
      - revision
      properties:
        revision:
          type: integer
          minimum: 1
  GlobalCredentialGrant:
    type: object
    required:
    - id
    - credential_id
    - project_id
    - operations
    - status
    - revision
    - created
    - updated
    properties:
      id:
        type: integer
      credential_id:
        type: integer
      project_id:
        type: integer
      operations:
        type: integer
        enum:
        - 1
        - 2
        - 3
      expires_at:
        type: string
        format: date-time
      status:
        type: string
        enum:
        - active
        - revoked
      revision:
        type: integer
      created:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time
  GrantedCredential:
    type: object
    description: Project-scoped value-free metadata. Owner, fingerprint, storage coordinates, and material are omitted.
    required:
    - credential_id
    - type
    - display_name
    - version
    - operations
    - grant_id
    - grant_revision
    properties:
      credential_id:
        type: integer
      type:
        type: string
        enum:
        - string
      display_name:
        type: string
      version:
        type: integer
      operations:
        type: integer
        enum:
        - 1
        - 3
      grant_id:
        type: integer
      grant_revision:
        type: integer
      expires_at:
        type: string
        format: date-time
  GlobalCredentialGrantProject:
    type: object
    description: Bounded global grant target selector.
    required:
    - id
    - name
    properties:
      id:
        type: integer
      name:
        type: string
  GlobalCredentialRevisionRequest:
    type: object
    required:
    - revision
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
  GlobalCredentialResolutionSnapshot:
    type: object
    description: Value-free provenance for one execution-time credential resolution attempt.
    required:
    - task_id
    - project_id
    - actor_id
    - dispatch_generation
    - target
    - credential_id
    - outcome
    - reason
    - occurred_at
    properties:
      task_id:
        type: integer
      project_id:
        type: integer
      actor_id:
        type: integer
        description: Zero identifies an actorless task that was denied before dispatch.
      runner_id:
        type: integer
      dispatch_generation:
        type: integer
        minimum: 0
      target:
        type: string
        maxLength: 64
      credential_id:
        type: integer
      grant_id:
        type: integer
      credential_version:
        type: integer
      version_fingerprint:
        type: string
        pattern: ^[a-f0-9]{64}$
      provider_version:
        type: integer
      outcome:
        type: string
        enum:
        - allowed
        - denied
        - failure
      reason:
        type: string
        enum:
        - allowed
        - actor_required
        - task_permission_denied
        - consume_permission_denied
        - capability_unavailable
        - credential_unavailable
        - grant_unavailable
        - provider_unavailable
        - audit_unavailable
        - injection_failed
      occurred_at:
        type: string
        format: date-time
  GlobalCredentialUsage:
    type: object
    required:
    - id
    - snapshot
    properties:
      id:
        type: integer
      snapshot:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialResolutionSnapshot
  GlobalCredentialImpact:
    type: object
    description: Value-free transition preview for rotation, grant, disable, and deletion decisions.
    required:
    - credential_id
    - usage_count
    - project_count
    - active_grant_count
    properties:
      credential_id:
        type: integer
      usage_count:
        type: integer
      project_count:
        type: integer
      active_grant_count:
        type: integer
      last_used_at:
        type: string
        format: date-time
paths:
  /project/{project_id}/keys/generate:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    post:
      tags:
      - key-store
      summary: Generate and store a local SSH key pair
      description: Generates an encrypted local SSH credential. The private key is never returned; Access Key encryption
        must be configured.
      parameters:
      - name: Generated SSH Key
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyCreateRequest
      responses:
        201:
          description: SSH key generated
          schema:
            $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyResponse
        400:
          description: Invalid request, algorithm, storage, or encryption configuration
        403:
          description: Project-resource management permission required
  /project/{project_id}/keys/{key_id}/rotate:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/key_id
    post:
      tags:
      - key-store
      summary: Rotate a local SSH key with a newly generated pair
      description: Replaces an existing local, non-synchronized SSH credential after explicit confirmation and returns
        only its new public metadata.
      parameters:
      - name: SSH Key Rotation
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyRotateRequest
      responses:
        200:
          description: SSH key rotated
          schema:
            $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyResponse
        400:
          description: Rotation not confirmed or key is not eligible
        403:
          description: Project-resource management permission required
  /audit-webhook:
    get:
      tags:
      - signed-webhook
      summary: Read the non-secret audit webhook configuration and signing status
      responses:
        200:
          description: Safe configuration and current/next signing metadata
          schema:
            $ref: ./api-docs.yml#/definitions/AuditWebhookConfiguration
        403:
          description: Administrator permission required
        404:
          description: Audit webhook export is unavailable in this edition
    put:
      tags:
      - signed-webhook
      summary: Configure the HTTPS audit receiver and optional legacy Bearer credential
      parameters:
      - name: configuration
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/AuditWebhookConfigurationInput
      responses:
        200:
          description: Updated non-secret configuration
          schema:
            $ref: ./api-docs.yml#/definitions/AuditWebhookConfiguration
        400:
          description: Invalid endpoint, credential, unknown field, or body
        403:
          description: Administrator permission required
        404:
          description: Audit webhook export is unavailable in this edition
  /audit-webhook/signing-secret:
    post:
      tags:
      - signed-webhook
      summary: Create and reveal the initial audit signing secret once
      parameters:
      - name: revision
        in: query
        required: true
        type: integer
        minimum: 0
        x-example: 0
      responses:
        201:
          description: One-time secret and safe signing status
          schema:
            $ref: ./api-docs.yml#/definitions/AuditWebhookSigningSecret
        400:
          description: Invalid revision or signing operation
        403:
          description: Administrator permission required
        409:
          description: Signing state changed or already has a current key
  /audit-webhook/signing-secret/stage:
    post:
      tags:
      - signed-webhook
      summary: Stage and reveal the next audit signing secret once
      parameters:
      - name: revision
        in: query
        required: true
        type: integer
        minimum: 0
        x-example: 0
      responses:
        201:
          description: One-time next secret and safe signing status
          schema:
            $ref: ./api-docs.yml#/definitions/AuditWebhookSigningSecret
        400:
          description: Invalid revision or signing operation
        403:
          description: Administrator permission required
        409:
          description: Signing state changed or next-key slot is occupied
  /audit-webhook/signing-secret/promote:
    post:
      tags:
      - signed-webhook
      summary: Promote a staged audit key and retain the old current key for overlap
      parameters:
      - name: revision
        in: query
        required: true
        type: integer
        minimum: 0
        x-example: 0
      responses:
        200:
          description: Safe signing status after promotion
          schema:
            $ref: ./api-docs.yml#/definitions/WebhookSigningStatus
        400:
          description: Invalid revision or signing operation
        403:
          description: Administrator permission required
        409:
          description: Signing state changed or next key is not staged
  /audit-webhook/signing-secret/next:
    delete:
      tags:
      - signed-webhook
      summary: Revoke the staged or retired audit next key
      parameters:
      - name: revision
        in: query
        required: true
        type: integer
        minimum: 0
        x-example: 0
      responses:
        200:
          description: Safe signing status after revocation
          schema:
            $ref: ./api-docs.yml#/definitions/WebhookSigningStatus
        400:
          description: Invalid revision or signing operation
        403:
          description: Administrator permission required
        409:
          description: Signing state changed
  /audit-webhook/test:
    post:
      tags:
      - signed-webhook
      summary: Persist and send one controlled signed audit delivery
      parameters:
      - name: key
        in: query
        required: false
        type: string
        default: current
        enum:
        - current
        - next
      responses:
        201:
          description: Persisted delivery; inspect its status and attempt history
          schema:
            $ref: ./api-docs.yml#/definitions/AuditWebhookDelivery
        400:
          description: Invalid key selection
        403:
          description: Administrator permission required
        409:
          description: Endpoint or selected signing key is not configured
  /audit-webhook/pause:
    post:
      tags:
      - signed-webhook
      summary: Pause background audit delivery claims
      responses:
        200:
          description: Updated non-secret configuration
          schema:
            $ref: ./api-docs.yml#/definitions/AuditWebhookConfiguration
        403:
          description: Administrator permission required
        409:
          description: Audit webhook is not configured
  /audit-webhook/resume:
    post:
      tags:
      - signed-webhook
      summary: Resume background audit delivery claims
