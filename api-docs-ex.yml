        200:
          description: Updated trigger with safe key metadata
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowTrigger
        403:
          description: Workflow administration permission required
        409:
          description: Stale revision or invalid signing state
  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/history:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/trigger_id
    get:
      tags:
      - workflow
      - signed-webhook
      summary: List safe trigger invocation and webhook replay history
      parameters:
      - $ref: ./api-docs.yml#/parameters/history_count
      - $ref: ./api-docs.yml#/parameters/history_before
      responses:
        200:
          description: Newest safe invocation records first
          schema:
            type: array
            maxItems: 100
            items:
              $ref: ./api-docs.yml#/definitions/WorkflowTriggerHistoryEntry
        403:
          description: Workflow administration permission required
  /workflow-triggers/{project_id}/{workflow_id}/{trigger_id}/webhook:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/trigger_id
    post:
      tags:
      - signed-webhook
      summary: Start a workflow from an authenticated, fresh, replay-protected webhook
      description: The HMAC binds POST, the exact raw path and query, event ID, Unix timestamp, key ID, and exact
        body bytes using the semaphore.webhook.v1 binary framing. Every protocol header is required exactly once.
        Bearer fallback is rejected.
      security: []
      parameters:
      - name: X-Semaphore-Webhook-Version
        in: header
        required: true
        type: string
        enum:
        - semaphore.webhook.v1
      - name: X-Semaphore-Event-ID
        in: header
        required: true
        type: string
        minLength: 16
        maxLength: 128
      - name: X-Semaphore-Timestamp
        in: header
        required: true
        type: string
        description: Canonical Unix seconds within five minutes of server UTC time.
      - name: X-Semaphore-Key-ID
        in: header
        required: true
        type: string
        pattern: ^swhkid_[-_A-Za-z0-9]+$
      - name: X-Semaphore-Signature
        in: header
        required: true
        type: string
        pattern: ^v1=[0-9a-f]{64}$
      - name: payload
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/WorkflowTriggerInvocationInput
      responses:
        201:
          description: Event claimed durably and workflow start recorded
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowTriggerFireResult
        401:
          description: Authentication, signature, key, timestamp, trigger state, or authorization rejected without
            detail
        409:
          description: Event ID was already claimed; no second workflow is started
        413:
          description: Body exceeds 256 KiB
  /project/{project_id}/workflows/{workflow_id}/preflight:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    post:
      tags:
      - workflow
      summary: Preview a workflow execution plan without starting it
      responses:
        200:
          description: Value-free, provisional workflow execution plan
          schema:
            $ref: ./api-docs.yml#/definitions/ExecutionPreflightPlan
        403:
          description: Workflow start permission denied
        404:
          description: Workflow hidden or execution preflight capability unavailable
  /project/{project_id}/workflows/{workflow_id}/runs/{run_id}/stop:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/run_id
    post:
      tags:
      - workflow
      summary: Stop an active workflow run
      responses:
        200:
          description: workflow run stopped
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowRun
  /project/{project_id}/workflows/{workflow_id}/runs/{run_id}/file-artifacts:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/run_id
    get:
      tags:
      - workflow
      summary: List authorized file artifact metadata for a workflow run
      description: Returns only available or expired metadata after current workflow and artifact-role authorization.
        Staging and failed uploads are never visible.
      responses:
        200:
          description: Newest authorized file artifact metadata first
          schema:
            type: array
            maxItems: 100
            items:
              $ref: ./api-docs.yml#/definitions/WorkflowFileArtifact
        404:
          description: Workflow run is hidden or does not exist
    post:
      tags:
      - workflow
      summary: Begin a bounded file artifact upload for the current task attempt
      description: Workflow, run, node, task attempt, producer, credentials, and retention provenance are revalidated
        and derived by the server. The request reserves the immutable run quota.
      parameters:
      - name: artifact
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/WorkflowFileArtifactUpload
      responses:
        201:
          description: Staging metadata with revision 1
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowFileArtifact
        400:
          description: Invalid metadata or task-attempt binding
        404:
          description: Workflow run or producer is hidden or unavailable
        409:
          description: Artifact identity or task attempt conflicts with current state
        413:
          description: Metadata body, per-artifact, per-run, or artifact-count limit exceeded
  /project/{project_id}/workflows/{workflow_id}/runs/{run_id}/file-artifacts/{artifact_id}:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/run_id
    - $ref: ./api-docs.yml#/parameters/artifact_id
    get:
      tags:
      - workflow
      summary: Read one available file artifact metadata record
      responses:
        200:
          description: Authorized available metadata
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowFileArtifact
        404:
          description: Artifact is missing, hidden, partial, failed, expired, or deleted
  /project/{project_id}/workflows/{workflow_id}/runs/{run_id}/file-artifacts/{artifact_id}/content:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/run_id
    - $ref: ./api-docs.yml#/parameters/artifact_id
    get:
      tags:
      - workflow
      summary: Stream an authorized available file artifact
      produces:
      - application/octet-stream
      parameters:
      - name: Range
        in: header
        required: false
        type: string
        description: Byte ranges are not supported; any non-empty value returns 416.
      responses:
        200:
          description: Exact immutable file bytes
          headers:
            Content-Disposition:
              type: string
              description: Safe attachment filename generated by the server
            Content-Length:
              type: integer
              format: int64
              description: Immutable artifact size
            X-Checksum-SHA256:
              type: string
              description: Lowercase SHA-256 checksum of the streamed bytes
            X-Content-Type-Options:
              type: string
              description: Always nosniff
            Cache-Control:
              type: string
              description: Always private, no-store
            Accept-Ranges:
              type: string
              description: Always none
          schema:
            type: string
            format: binary
        404:
          description: Artifact is missing, hidden, partial, failed, expired, or deleted
        416:
          description: Range requests are unsupported
    head:
      tags:
      - workflow
      summary: Authorize and inspect an available file artifact without streaming content
      responses:
        200:
          description: The same safe content headers as GET, without a response body
        404:
          description: Artifact is missing, hidden, partial, failed, expired, or deleted
        416:
          description: Range requests are unsupported
    put:
      tags:
      - workflow
      summary: Append one exact-offset bounded chunk to a staging artifact
      consumes:
      - application/octet-stream
      parameters:
      - name: revision
        in: query
        required: true
        type: integer
        minimum: 1
        x-example: 1
      - name: offset
        in: query
        required: true
        type: integer
        format: int64
        minimum: 0
        x-example: 0
      - name: chunk
        in: body
        required: true
        schema:
          type: string
          format: binary
          maxLength: 1048576
      responses:
        200:
          description: Updated staging metadata and next revision
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowFileArtifact
        400:
          description: Invalid revision, offset, empty body, or task-attempt binding
        404:
          description: Artifact or producer is hidden or unavailable
        409:
          description: Revision, offset, state, or task-attempt conflict
        413:
          description: Chunk exceeds 1 MiB
  /project/{project_id}/workflows/{workflow_id}/runs/{run_id}/file-artifacts/{artifact_id}/finalize:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/run_id
    - $ref: ./api-docs.yml#/parameters/artifact_id
    post:
      tags:
      - workflow
      summary: Atomically finalize and expose a complete staging artifact
      parameters:
      - name: revision
        in: query
        required: true
        type: integer
        minimum: 1
        x-example: 1
      responses:
        200:
          description: Available immutable metadata
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowFileArtifact
        400:
          description: Invalid revision or task-attempt binding
        404:
          description: Artifact or producer is hidden or unavailable
        409:
          description: Revision, state, or task-attempt conflict
        422:
          description: Content is incomplete or its SHA-256 checksum does not match
  /workflow-artifact-retention:
    get:
      tags:
      - workflow
      summary: Read global workflow file artifact retention
      description: Requires global system-management permission. A missing global policy is represented by effective
        built-in revision 0.
      responses:
        200:
          description: Published global policy, if any, and effective limits
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionState
        403:
          description: Missing global system-management permission
        404:
          description: Enhanced retention governance is unavailable
    put:
      tags:
      - workflow
      summary: Publish a new global workflow file artifact retention revision
      description: Scope, revision, actor, and database timestamp are derived by the server. A tighter global policy
        cannot invalidate a current project policy.
      parameters:
      - name: retention
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionUpdate
      responses:
        200:
          description: Published global policy and effective limits
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionState
        400:
          description: Invalid or unexpected input
        403:
          description: Missing global system-management permission
        409:
          description: Expected revision is stale or a current project policy would be widened
        413:
          description: Request exceeds 16 KiB
        404:
          description: Enhanced retention governance is unavailable
  /project/{project_id}/workflow-artifact-retention:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    get:
      tags:
      - workflow
      - project
      summary: Read effective project workflow file artifact retention
      description: Requires project resource-management permission.
      responses:
        200:
          description: Current global/project policies and effective narrowed limits
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionState
        403:
          description: Missing project resource-management permission
        404:
          description: Project or Enhanced retention governance is unavailable
    put:
      tags:
      - workflow
      - project
      summary: Publish a new project workflow file artifact retention revision
      description: The project policy may only narrow the current global or built-in limits. Scope, project, revision,
        actor, and database timestamp are derived by the server.
      parameters:
      - name: retention
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionUpdate
      responses:
        200:
          description: Published project policy and effective narrowed limits
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowArtifactRetentionState
        400:
          description: Invalid or unexpected input
        403:
          description: Missing project resource-management permission
        404:
          description: Project or Enhanced retention governance is unavailable
        409:
          description: Expected revision is stale or the project policy widens global limits
        413:
          description: Request exceeds 16 KiB
  /project/{project_id}/schedules/validate:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
