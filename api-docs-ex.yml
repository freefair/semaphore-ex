        in: query
        type: integer
        minimum: 1
      - name: task_id
        in: query
        type: integer
        minimum: 1
      - name: outcome
        in: query
        type: string
        enum:
        - allowed
        - denied
        - failure
      responses:
        200:
          description: Bounded newest-first usage history
          schema:
            type: array
            items:
