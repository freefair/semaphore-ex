          description: Stale revision, invalid signing state, or encryption unavailable
  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/webhook-signing/stage:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/trigger_id
    post:
      tags:
