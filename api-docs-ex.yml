# Fork-owned API definitions and paths, referenced by api-docs.yml.
definitions:
  ExecutionPreflightPlan:
    type: object
    required:
    - contract_version
    - intent
    - project_id
    - actor_id
    - definition
    - fingerprint
    - expires_at
    properties:
      contract_version:
        type: integer
        enum:
        - 1
      intent:
        type: string
        enum:
        - task
        - workflow
      project_id:
        type: integer
      actor_id:
        type: integer
      template_id:
        type: integer
      workflow_id:
        type: integer
      definition:
        type: object
        properties:
          kind:
            type: string
          id:
            type: integer
          name:
            type: string
          revision:
            type: string
          fingerprint:
            type: string
      inputs:
        type: array
        maxItems: 128
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
            source:
              type: string
            present:
              type: boolean
            sensitive:
              type: boolean
      references:
        type: array
        maxItems: 256
        items:
          type: object
          properties:
            kind:
              type: string
            id:
              type: integer
            name:
              type: string
            binding_target:
              type: string
            visible:
              type: boolean
            reason:
              type: string
      commands:
        type: array
        maxItems: 128
        description: Value-free command shapes; argument and input values are omitted.
        items:
          type: object
      placements:
        type: array
        maxItems: 128
        description: Provisional runner selections with at most 100 redacted candidates each.
        items:
          type: object
      findings:
        type: array
        maxItems: 128
        items:
          type: object
          properties:
            severity:
              type: string
              enum:
              - info
              - warning
              - denial
            code:
              type: string
            message:
              type: string
      fingerprint:
        type: string
      expires_at:
        type: string
        format: date-time
      review_token:
        type: string
        description: Opaque short-lived review binding; it is not execution authority.
  ExecutionPreflightStale:
    type: object
    properties:
      code:
        type: string
        enum:
        - stale_execution_preflight
        - execution_preflight_denied
      changes:
        type: array
        maxItems: 16
        items:
          type: string
      preflight:
        $ref: ./api-docs.yml#/definitions/ExecutionPreflightPlan
  GeneratedSSHKeyMetadata:
    type: object
    required:
    - public_key
    - fingerprint
    - algorithm
    properties:
      public_key:
        type: string
        description: Public key in authorized_keys-compatible OpenSSH format.
      fingerprint:
        type: string
        description: OpenSSH SHA-256 public-key fingerprint.
      algorithm:
        type: string
        enum:
        - ed25519
        - rsa-3072
  GeneratedSSHKeyCreateRequest:
    type: object
    required:
    - name
    additionalProperties: false
    properties:
      name:
        type: string
      login:
        type: string
      algorithm:
        type: string
        default: ed25519
        enum:
        - ed25519
        - rsa-3072
  GeneratedSSHKeyRotateRequest:
    type: object
    required:
    - confirm_rotation
    additionalProperties: false
    properties:
      algorithm:
        type: string
        default: ed25519
        enum:
        - ed25519
        - rsa-3072
      confirm_rotation:
        type: boolean
        enum:
        - true
  GeneratedSSHKeyResponse:
    type: object
    required:
    - key
    - public_key
    - fingerprint
    - algorithm
    properties:
      key:
        $ref: ./api-docs.yml#/definitions/AccessKey
      public_key:
        type: string
        description: Public key in authorized_keys-compatible OpenSSH format.
      fingerprint:
        type: string
        description: OpenSSH SHA-256 public-key fingerprint.
      algorithm:
        type: string
        enum:
        - ed25519
        - rsa-3072
  RunnerAttempt:
    type: object
    properties:
      id:
        type: integer
      project_id:
        type: integer
      task_id:
        type: integer
      generation:
        type: integer
      runner_id:
        type: integer
      runner_name:
        type: string
      assigned_at:
        type: string
        format: date-time
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      outcome:
        type: string
        enum:
        - active
        - requeued
        - succeeded
        - failed
        - stopped
      reason:
        type: string
      requested_tags:
        type: array
        items:
          type: string
      match_mode:
        type: string
        enum:
        - all
        - any
      placement_reason:
        type: string
      requested_executor_image:
        type: string
      resolved_executor_image:
        type: string
  TaskSummary:
    type: object
    description: Persisted, normalized Ansible result summary. Available in the enhanced edition.
    required:
    - version
    - task_id
    - project_id
    - runner_result_version
    - state
    - task_status
    - expected_hosts
    - total_hosts
    - ok_hosts
    - failed_hosts
    - event_count
    - updated
    properties:
      version:
        type: integer
        description: Server-side summary schema version
      task_id:
        type: integer
      project_id:
        type: integer
      runner_result_version:
        type: integer
        description: Version of the runner event contract
      state:
        type: string
        enum:
        - collecting
        - complete
        - partial
        - empty
        - unsupported
      task_status:
        type: string
      expected_hosts:
        type: integer
      total_hosts:
        type: integer
      ok_hosts:
        type: integer
      failed_hosts:
        type: integer
      event_count:
        type: integer
      diagnostic:
        type: string
      started_at:
        type: string
        format: date-time
        x-nullable: true
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      updated:
        type: string
        format: date-time
  TaskSummaryHost:
    type: object
    properties:
      id:
        type: integer
      host:
        type: string
      status:
        type: string
        enum:
        - success
        - failed
      changed:
        type: integer
      failed:
        type: integer
      ignored:
        type: integer
      ok:
        type: integer
      rescued:
        type: integer
      skipped:
        type: integer
      unreachable:
        type: integer
      started_at:
        type: string
        format: date-time
        x-nullable: true
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      duration_ms:
        type: integer
        format: int64
  TaskSummaryStage:
    type: object
    properties:
      id:
        type: integer
      stage_id:
        type: string
      stage:
        type: string
      ok:
        type: integer
      changed:
        type: integer
      failed:
        type: integer
      ignored:
        type: integer
      rescued:
        type: integer
      skipped:
        type: integer
      unreachable:
        type: integer
      started_at:
        type: string
        format: date-time
        x-nullable: true
      ended_at:
        type: string
        format: date-time
        x-nullable: true
      duration_ms:
        type: integer
        format: int64
  TaskSummaryError:
    type: object
    properties:
      id:
        type: integer
      event_id:
        type: string
      host:
        type: string
      stage:
        type: string
      status:
        type: string
        enum:
        - failed
        - unreachable
      error:
        type: string
        description: Bounded error text with common secret-bearing values redacted
      output_time:
        type: string
        format: date-time
        x-nullable: true
  TaskSummaryHostPage:
    type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/TaskSummaryHost
      next_cursor:
        type: integer
        x-nullable: true
  TaskSummaryStagePage:
    type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/TaskSummaryStage
      next_cursor:
        type: integer
        x-nullable: true
  TaskSummaryErrorPage:
    type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/TaskSummaryError
      next_cursor:
        type: integer
        x-nullable: true
  WorkflowRunDefinition:
    type: object
    description: Immutable graph presentation data for a workflow run; execution and resource configuration is not
      exposed.
    properties:
      id:
        type: integer
      name:
        type: string
      definition_version:
        type: integer
      revision:
        type: integer
      nodes:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/WorkflowRunDefinitionNode
      edges:
        type: array
        items:
          $ref: ./api-docs.yml#/definitions/WorkflowRunDefinitionEdge
  WorkflowRunDefinitionNode:
    type: object
    properties:
      id:
        type: integer
      template_id:
        type: integer
      display_name:
        type: string
      kind:
        type: string
        enum:
        - task
        - approval
        - note
      convergence_mode:
        type: string
        enum:
        - all
        - any
      approval_timeout:
        type: integer
      approval_message:
        type: string
      note:
        type: string
      position_x:
        type: integer
      position_y:
        type: integer
  WorkflowRunDefinitionEdge:
    type: object
    properties:
      id:
        type: integer
      source_node_id:
        type: integer
      destination_node_id:
        type: integer
      condition:
        type: string
        enum:
        - on_success
        - on_failure
        - always
      label:
        type: string
  WorkflowRunTemplate:
    type: object
    description: Template identity needed to label the immutable run graph.
    properties:
      id:
        type: integer
      name:
        type: string
  WorkflowRunTask:
    type: object
    description: Task identity and status needed by the workflow run view.
    properties:
      id:
        type: integer
      status:
        type: string
      used_runner_id:
        type: integer
      used_runner_name:
        type: string
  WorkflowRunNode:
    type: object
    properties:
      id:
        type: integer
      project_id:
        type: integer
      workflow_run_id:
        type: integer
      workflow_node_id:
        type: integer
      template_id:
        type: integer
      status:
        type: string
        enum:
        - pending
        - queued
        - running
        - succeeded
        - failed
        - stopped
        - blocked
      task_id:
        type: integer
      reason:
        type: string
      template:
        $ref: ./api-docs.yml#/definitions/Template
      created:
        type: string
        format: date-time
      queued:
        type: string
        format: date-time
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
  GlobalCredentialExternalReference:
    type: object
    description: Value-free Vault or OpenBao reference. The server stores but does not resolve it in this API layer.
    required:
    - provider
    - provider_id
    - mount
    - path
    - version
    - field
    additionalProperties: false
    properties:
      provider:
        type: string
        enum:
        - vault
        - openbao
      provider_id:
        type: string
        maxLength: 64
      mount:
        type: string
        maxLength: 128
      path:
        type: string
        maxLength: 512
      version:
        type: integer
        minimum: 1
      field:
        type: string
        maxLength: 128
  GlobalCredentialMaterialInput:
    type: object
    description: Write-only material. Supply exactly one of string_value or external_reference. No response returns
      this object.
    additionalProperties: false
    properties:
      string_value:
        type: string
        format: password
        minLength: 1
        maxLength: 4096
      external_reference:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialExternalReference
  GlobalCredentialCreateRequest:
    type: object
    required:
    - type
    - display_name
    - material
    additionalProperties: false
    properties:
      type:
        type: string
        enum:
        - string
      display_name:
        type: string
        minLength: 1
        maxLength: 128
      material:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialMaterialInput
  GlobalCredentialSummary:
    type: object
    description: Least-privilege global view. Material, owner, provider coordinates, and timestamps are omitted.
    required:
    - id
    - type
    - display_name
    - enabled
    - revision
    - current_version
    - fingerprint
    - material_kind
    properties:
      id:
        type: integer
      type:
        type: string
        enum:
        - string
      display_name:
        type: string
      enabled:
        type: boolean
      revision:
        type: integer
        minimum: 1
      current_version:
        type: integer
        minimum: 1
      fingerprint:
        type: string
        description: Random opaque per-version identifier, never a content hash.
        pattern: ^[a-f0-9]{64}$
      material_kind:
        type: string
        enum:
        - local_encrypted
        - external_reference
  GlobalCredentialDetail:
    allOf:
    - $ref: ./api-docs.yml#/definitions/GlobalCredentialSummary
    - type: object
      required:
      - owner_user_id
      - created
      - updated
      properties:
        owner_user_id:
          type: integer
        external_reference:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialExternalReference
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
  GlobalCredentialMetadataUpdateRequest:
    type: object
    required:
    - revision
    - display_name
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
      display_name:
        type: string
        minLength: 1
        maxLength: 128
  GlobalCredentialEnabledRequest:
    type: object
    required:
    - revision
    - enabled
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
      enabled:
        type: boolean
  GlobalCredentialRotateRequest:
    type: object
    required:
    - revision
    - material
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
      material:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialMaterialInput
  GlobalCredentialGrantInput:
    type: object
    required:
    - project_id
    - operations
    additionalProperties: false
    properties:
      project_id:
        type: integer
        minimum: 1
      operations:
        type: integer
        description: Bit mask containing reference (1), consume (2), or both (3).
        enum:
        - 1
        - 2
        - 3
      expires_at:
        type: string
        format: date-time
  GlobalCredentialGrantUpdateRequest:
    allOf:
    - $ref: ./api-docs.yml#/definitions/GlobalCredentialGrantInput
    - type: object
      required:
      - revision
      properties:
        revision:
          type: integer
          minimum: 1
  GlobalCredentialGrant:
    type: object
    required:
    - id
    - credential_id
    - project_id
    - operations
    - status
    - revision
    - created
    - updated
    properties:
      id:
        type: integer
      credential_id:
        type: integer
      project_id:
        type: integer
      operations:
        type: integer
        enum:
        - 1
        - 2
        - 3
      expires_at:
        type: string
        format: date-time
      status:
        type: string
        enum:
        - active
        - revoked
      revision:
        type: integer
      created:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time
  GrantedCredential:
    type: object
    description: Project-scoped value-free metadata. Owner, fingerprint, storage coordinates, and material are omitted.
    required:
    - credential_id
    - type
    - display_name
    - version
    - operations
    - grant_id
    - grant_revision
    properties:
      credential_id:
        type: integer
      type:
        type: string
        enum:
        - string
      display_name:
        type: string
      version:
        type: integer
      operations:
        type: integer
        enum:
        - 1
        - 3
      grant_id:
        type: integer
      grant_revision:
        type: integer
      expires_at:
        type: string
        format: date-time
  GlobalCredentialGrantProject:
    type: object
    description: Bounded global grant target selector.
    required:
    - id
    - name
    properties:
      id:
        type: integer
      name:
        type: string
  GlobalCredentialRevisionRequest:
    type: object
    required:
    - revision
    additionalProperties: false
    properties:
      revision:
        type: integer
        minimum: 1
  GlobalCredentialResolutionSnapshot:
    type: object
    description: Value-free provenance for one execution-time credential resolution attempt.
    required:
    - task_id
    - project_id
    - actor_id
    - dispatch_generation
    - target
    - credential_id
    - outcome
    - reason
    - occurred_at
    properties:
      task_id:
        type: integer
      project_id:
        type: integer
      actor_id:
        type: integer
        description: Zero identifies an actorless task that was denied before dispatch.
      runner_id:
        type: integer
      dispatch_generation:
        type: integer
        minimum: 0
      target:
        type: string
        maxLength: 64
      credential_id:
        type: integer
      grant_id:
        type: integer
      credential_version:
        type: integer
      version_fingerprint:
        type: string
        pattern: ^[a-f0-9]{64}$
      provider_version:
        type: integer
      outcome:
        type: string
        enum:
        - allowed
        - denied
        - failure
      reason:
        type: string
        enum:
        - allowed
        - actor_required
        - task_permission_denied
        - consume_permission_denied
        - capability_unavailable
        - credential_unavailable
        - grant_unavailable
        - provider_unavailable
        - audit_unavailable
        - injection_failed
      occurred_at:
        type: string
        format: date-time
  GlobalCredentialUsage:
    type: object
    required:
    - id
    - snapshot
    properties:
      id:
        type: integer
      snapshot:
        $ref: ./api-docs.yml#/definitions/GlobalCredentialResolutionSnapshot
  GlobalCredentialImpact:
    type: object
    description: Value-free transition preview for rotation, grant, disable, and deletion decisions.
    required:
    - credential_id
    - usage_count
    - project_count
    - active_grant_count
    properties:
      credential_id:
        type: integer
      usage_count:
        type: integer
      project_count:
        type: integer
      active_grant_count:
        type: integer
      last_used_at:
        type: string
        format: date-time
paths:
  /project/{project_id}/keys/generate:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    post:
      tags:
      - key-store
      summary: Generate and store a local SSH key pair
      description: Generates an encrypted local SSH credential. The private key is never returned; Access Key encryption
        must be configured.
      parameters:
      - name: Generated SSH Key
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyCreateRequest
      responses:
        201:
          description: SSH key generated
          schema:
            $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyResponse
        400:
          description: Invalid request, algorithm, storage, or encryption configuration
        403:
          description: Project-resource management permission required
  /project/{project_id}/keys/{key_id}/rotate:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/key_id
    post:
      tags:
      - key-store
      summary: Rotate a local SSH key with a newly generated pair
      description: Replaces an existing local, non-synchronized SSH credential after explicit confirmation and returns
        only its new public metadata.
      parameters:
      - name: SSH Key Rotation
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyRotateRequest
      responses:
        200:
          description: SSH key rotated
          schema:
            $ref: ./api-docs.yml#/definitions/GeneratedSSHKeyResponse
        400:
          description: Rotation not confirmed or key is not eligible
        403:
          description: Project-resource management permission required
  /project/{project_id}/workflows/{workflow_id}/preflight:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    post:
      tags:
      - workflow
      summary: Preview a workflow execution plan without starting it
      responses:
        200:
          description: Value-free, provisional workflow execution plan
          schema:
            $ref: ./api-docs.yml#/definitions/ExecutionPreflightPlan
        403:
          description: Workflow start permission denied
        404:
          description: Workflow hidden or execution preflight capability unavailable
  /project/{project_id}/workflows/{workflow_id}/runs/{run_id}/stop:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/workflow_id
    - $ref: ./api-docs.yml#/parameters/run_id
    post:
      tags:
      - workflow
      summary: Stop an active workflow run
      responses:
        200:
          description: workflow run stopped
          schema:
            $ref: ./api-docs.yml#/definitions/WorkflowRun
  /project/{project_id}/schedules/validate:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    post:
      tags:
      - schedule
      summary: Validate a schedule and preview its next occurrence
      parameters:
      - name: schedule
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/ScheduleRequest
      responses:
        200:
          description: Valid schedule with effective timezone and next run
          schema:
            $ref: ./api-docs.yml#/definitions/Schedule
        400:
          description: Invalid schedule, timezone, or cron expression
  /project/{project_id}/views/{view_id}/templates:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/view_id
    get:
      tags:
      - template
      summary: Get visible templates in a view
      parameters:
      - name: search
        in: query
        required: false
        type: string
        maxLength: 256
        description: Case-insensitive literal match over the visible template name, description, playbook, and runner
          tags. SQL wildcard characters have no special meaning.
      - name: count
        in: query
        required: false
        type: integer
        minimum: 1
        maximum: 200
      - name: offset
        in: query
        required: false
        type: integer
        minimum: 0
        description: Requires count.
      responses:
        200:
          description: Visible matching templates in deterministic order
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/Template
        400:
          description: Invalid search or pagination query
  /project/{project_id}/tasks/preflight:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    post:
      tags:
      - task
      summary: Preview a task execution plan without starting it
      parameters:
      - name: task
        in: body
        required: true
        schema:
          type: object
          required:
          - template_id
          properties:
            template_id:
              type: integer
      responses:
        200:
          description: Value-free, provisional task execution plan
          schema:
            $ref: ./api-docs.yml#/definitions/ExecutionPreflightPlan
        403:
          description: Task start permission denied
        404:
          description: Template hidden or execution preflight capability unavailable
  /project/{project_id}/tasks/{task_id}/credential-usage:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/task_id
    get:
      tags:
      - task
      - global-credential
      summary: Get value-free credential provenance for a visible task
      parameters:
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      - name: before_id
        in: query
        type: integer
        minimum: 1
      - name: outcome
        in: query
        type: string
        enum:
        - allowed
        - denied
        - failure
      responses:
        200:
          description: Bounded task-scoped credential provenance
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/GlobalCredentialUsage
        400:
          description: Invalid or ambiguous filters
        403:
          description: Task is not visible to the current user
  /project/{project_id}/tasks/{task_id}/runner-attempts:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/task_id
    get:
      tags:
      - task
      summary: Get runner assignment attempts for a task
      responses:
        200:
          description: Assignment attempts ordered by generation
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/RunnerAttempt
  /project/{project_id}/tasks/{task_id}/ansible/summary:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/task_id
    get:
      tags:
      - task
      summary: Get the persisted Ansible task summary
      description: Returns the project-scoped normalized summary without reparsing task logs. Missing or interrupted
        terminal summaries are repaired from persisted events.
      responses:
        200:
          description: Persisted task summary
          schema:
            $ref: ./api-docs.yml#/definitions/TaskSummary
        404:
          description: Project or task not found
  /project/{project_id}/tasks/{task_id}/ansible/summary/hosts:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/task_id
    - name: count
      in: query
      type: integer
      minimum: 1
      maximum: 200
      default: 50
    - name: before
      in: query
      type: integer
      minimum: 1
      description: Return rows with IDs lower than this cursor
    get:
      tags:
      - task
      summary: Get a bounded page of persisted Ansible host results
      responses:
        200:
          description: Host result page
          schema:
            $ref: ./api-docs.yml#/definitions/TaskSummaryHostPage
        404:
          description: Project or task not found
  /project/{project_id}/tasks/{task_id}/ansible/summary/stages:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/task_id
    - name: count
      in: query
      type: integer
      minimum: 1
      maximum: 200
      default: 50
    - name: before
      in: query
      type: integer
      minimum: 1
      description: Return stage groups with event IDs lower than this cursor
    get:
      tags:
      - task
      summary: Get a bounded page of persisted Ansible stage results
      responses:
        200:
          description: Stage result page
          schema:
            $ref: ./api-docs.yml#/definitions/TaskSummaryStagePage
        404:
          description: Project or task not found
  /project/{project_id}/tasks/{task_id}/ansible/summary/errors:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    - $ref: ./api-docs.yml#/parameters/task_id
    - name: count
      in: query
      type: integer
      minimum: 1
      maximum: 200
      default: 50
    - name: before
      in: query
      type: integer
      minimum: 1
      description: Return rows with IDs lower than this cursor
    get:
      tags:
      - task
      summary: Get a bounded page of redacted Ansible failures
      responses:
        200:
          description: Error result page
          schema:
            $ref: ./api-docs.yml#/definitions/TaskSummaryErrorPage
        404:
          description: Project or task not found
  /global-credentials:
    get:
      tags:
      - global-credential
      summary: List global credential summaries
      description: Requires global audit or any global credential metadata, rotation, or grant permission. Values
        and external reference coordinates are never returned.
      parameters:
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      - name: offset
        in: query
        type: integer
        minimum: 0
        default: 0
      responses:
        200:
          description: Bounded value-free summaries
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/GlobalCredentialSummary
        400:
          description: Invalid or ambiguous pagination
        403:
          description: Missing global credential permission
    post:
      tags:
      - global-credential
      summary: Create a global credential and its first immutable version
      description: Requires both global.credentials.metadata.manage and global.credentials.rotate. Material is write-only.
      parameters:
      - name: Credential
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialCreateRequest
      responses:
        201:
          description: Value-free credential summary
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialSummary
        400:
          description: Invalid input
        403:
          description: Either required permission is missing
        503:
          description: Local material encryption is unavailable
  /global-credentials/grant-projects:
    get:
      tags:
      - global-credential
      summary: List bounded project grant targets
      description: Requires global.credentials.grant and returns at most 200 projects with only ID and name.
      responses:
        200:
          description: Ordered project selectors
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/GlobalCredentialGrantProject
        403:
          description: Missing global.credentials.grant
  /global-credentials/{credential_id}:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    get:
      tags:
      - global-credential
      summary: Get detailed global credential metadata
      description: Requires global.credentials.metadata.manage. Local material and ciphertext are always omitted.
      responses:
        200:
          description: Detailed value-free metadata
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialDetail
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
    put:
      tags:
      - global-credential
      summary: Update global credential display metadata
      description: Requires global.credentials.metadata.manage. Material cannot be included.
      parameters:
      - name: Metadata
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialMetadataUpdateRequest
      responses:
        200:
          description: Updated value-free summary
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialSummary
        400:
          description: Invalid input
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
        409:
          description: Stale revision
    delete:
      tags:
      - global-credential
      summary: Delete a disabled, ungranted global credential
      description: Requires global.credentials.metadata.manage. The credential must be disabled and have no grants.
      parameters:
      - name: expected_revision
        in: query
        required: true
        type: integer
        minimum: 1
      responses:
        204:
          description: Credential deleted
        400:
          description: Invalid or ambiguous revision
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
        409:
          description: Stale revision or dependency guard
  /global-credentials/{credential_id}/enabled:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    post:
      tags:
      - global-credential
      summary: Enable or disable a global credential
      description: Requires global.credentials.metadata.manage and records the explicit reversible transition.
      parameters:
      - name: State
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialEnabledRequest
      responses:
        200:
          description: Updated value-free summary
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialSummary
        400:
          description: Invalid input
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
        409:
          description: Stale revision
  /global-credentials/{credential_id}/rotate:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    post:
      tags:
      - global-credential
      summary: Append a new immutable credential version
      description: Requires global.credentials.rotate. New material is write-only and the response contains only
        a random opaque fingerprint.
      parameters:
      - name: Rotation
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialRotateRequest
      responses:
        200:
          description: Rotated value-free summary
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialSummary
        400:
          description: Invalid input
        403:
          description: Missing rotation permission
        404:
          description: Credential not found
        409:
          description: Stale revision
        503:
          description: Local material encryption is unavailable
  /global-credentials/{credential_id}/usage:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    get:
      tags:
      - global-credential
      - audit
      summary: List value-free credential resolution history
      description: Requires global.audit.read. Material and external provider coordinates are never returned.
      parameters:
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      - name: before_id
        in: query
        type: integer
        minimum: 1
      - name: project_id
        in: query
        type: integer
        minimum: 1
      - name: task_id
        in: query
        type: integer
        minimum: 1
      - name: outcome
        in: query
        type: string
        enum:
        - allowed
        - denied
        - failure
      responses:
        200:
          description: Bounded newest-first usage history
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/GlobalCredentialUsage
        400:
          description: Invalid or ambiguous filters
        403:
          description: Missing global.audit.read
        404:
          description: Credential not found
  /global-credentials/{credential_id}/impact:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    get:
      tags:
      - global-credential
      summary: Preview credential transition impact
      description: Requires any global credential administration or audit permission.
      responses:
        200:
          description: Value-free usage and active-grant counts
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialImpact
        403:
          description: Missing global credential permission
        404:
          description: Credential not found
  /global-credentials/{credential_id}/grants:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    get:
      tags:
      - global-credential
      summary: List project grants for one credential
      description: Requires global.credentials.grant.
      parameters:
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      - name: offset
        in: query
        type: integer
        minimum: 0
        default: 0
      responses:
        200:
          description: Credential grants
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/GlobalCredentialGrant
        403:
          description: Missing grant permission
    post:
      tags:
      - global-credential
      summary: Grant a project explicit operations on one credential
      description: Requires global.credentials.grant. One grant per credential/project pair is allowed.
      parameters:
      - name: Grant
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialGrantInput
      responses:
        201:
          description: Grant created
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialGrant
        400:
          description: Invalid input
        403:
          description: Missing grant permission
        404:
          description: Credential not found
        409:
          description: Grant already exists or a dependency changed
  /global-credentials/{credential_id}/grants/{grant_id}:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    - $ref: ./api-docs.yml#/parameters/grant_id
    put:
      tags:
      - global-credential
      summary: Update allowed operations or expiry
      description: Requires global.credentials.grant and preserves the current grant status.
      parameters:
      - name: Grant
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialGrantUpdateRequest
      responses:
        200:
          description: Grant updated
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialGrant
        400:
          description: Invalid input
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision
    delete:
      tags:
      - global-credential
      summary: Delete a revoked grant
      description: Requires global.credentials.grant. Active grants must be revoked first.
      parameters:
      - name: expected_revision
        in: query
        required: true
        type: integer
        minimum: 1
      responses:
        204:
          description: Grant deleted
        400:
          description: Invalid input or active grant
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision
  /global-credentials/{credential_id}/grants/{grant_id}/revoke:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    - $ref: ./api-docs.yml#/parameters/grant_id
    post:
      tags:
      - global-credential
      summary: Revoke a project grant
      description: Requires global.credentials.grant. Revocation is explicit and reversible.
      parameters:
      - name: Revision
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialRevisionRequest
      responses:
        200:
          description: Revoked grant
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialGrant
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision
  /global-credentials/{credential_id}/grants/{grant_id}/restore:
    parameters:
    - $ref: ./api-docs.yml#/parameters/credential_id
    - $ref: ./api-docs.yml#/parameters/grant_id
    post:
      tags:
      - global-credential
      summary: Restore a revoked project grant
      description: Requires global.credentials.grant.
      parameters:
      - name: Revision
        in: body
        required: true
        schema:
          $ref: ./api-docs.yml#/definitions/GlobalCredentialRevisionRequest
      responses:
        200:
          description: Restored grant
          schema:
            $ref: ./api-docs.yml#/definitions/GlobalCredentialGrant
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision
  /project/{project_id}/granted-credentials:
    parameters:
    - $ref: ./api-docs.yml#/parameters/project_id
    get:
      tags:
      - global-credential
      - project
      summary: List effective granted credential metadata for one project
      description: Requires project.credentials.granted.list. Only enabled credentials with active, unexpired reference
        grants are returned.
      parameters:
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      - name: offset
        in: query
        type: integer
        minimum: 0
        default: 0
      responses:
        200:
          description: Value-free effective project metadata
          schema:
            type: array
            items:
              $ref: ./api-docs.yml#/definitions/GrantedCredential
        400:
          description: Invalid or ambiguous pagination
        403:
          description: Missing project.credentials.granted.list
        404:
          description: Project not found or not visible
