---
swagger: '2.0'
info:
  title: Semaphore API
  description: |
    Semaphore API provides endpoints for managing and interacting with the Semaphore UI.
    This documentation outlines the available operations and data models.
  version: "2.16.14"

consumes:
  - application/json
produces:
  - application/json
  - text/plain; charset=utf-8

tags:
  - name: authentication
    description: Authentication, Logout & API Tokens
  - name: project
    description: Everything related to a project
  - name: user
    description: User-related API
  - name: integration
    description: Integration API
  - name: runner
    description: Runner management (project and global runners)
  - name: workflow
    description: Workflows
  - name: signed-webhook
    description: Enhanced audit and workflow webhook signing, rotation, and redacted history
  - name: global-credential
    description: Enhanced global credential metadata, versions, and project grants
  - name: policy-guardrail
    description: Enhanced global and project execution-admission policy governance

schemes:
  - http
  - https

basePath: /api

definitions:
  App:
    type: object

  ExecutionPreflightPlan:
    type: object
    required:
      - contract_version
      - intent
      - project_id
      - actor_id
      - definition
      - fingerprint
      - expires_at
    properties:
      contract_version:
        type: integer
        enum: [1]
      intent:
        type: string
        enum: [task, workflow]
      project_id:
        type: integer
      actor_id:
        type: integer
      template_id:
        type: integer
      workflow_id:
        type: integer
      definition:
        type: object
        properties:
          kind:
            type: string
          id:
            type: integer
          name:
            type: string
          revision:
            type: string
          fingerprint:
            type: string
      inputs:
        type: array
        maxItems: 128
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
            source:
              type: string
            present:
              type: boolean
            sensitive:
              type: boolean
      references:
        type: array
        maxItems: 256
        items:
          type: object
          properties:
            kind:
              type: string
            id:
              type: integer
            name:
              type: string
            binding_target:
              type: string
            visible:
              type: boolean
            reason:
              type: string
      commands:
        type: array
        maxItems: 128
        description: Value-free command shapes; argument and input values are omitted.
        items:
          type: object
      placements:
        type: array
        maxItems: 128
        description: Provisional runner selections with at most 100 redacted candidates each.
        items:
          type: object
      findings:
        type: array
        maxItems: 128
        items:
          type: object
          properties:
            severity:
              type: string
              enum: [info, warning, denial]
            code:
              type: string
            message:
              type: string
      fingerprint:
        type: string
      expires_at:
        type: string
        format: date-time
      review_token:
        type: string
        description: Opaque short-lived review binding; it is not execution authority.

  ExecutionPreflightStale:
    type: object
    properties:
      code:
        type: string
        enum: [stale_execution_preflight, execution_preflight_denied]
      changes:
        type: array
        maxItems: 16
        items:
          type: string
      preflight:
        $ref: '#/definitions/ExecutionPreflightPlan'

  PolicyGuardrailDraft:
    type: object
    required: [scope, source_yaml, revision, updated_by, created, updated]
    properties:
      scope:
        type: string
        enum: [global, project]
      project_id:
        type: integer
        minimum: 1
      source_yaml:
        type: string
        maxLength: 65536
      revision:
        type: integer
        minimum: 1
      active_revision:
        type: integer
        minimum: 1
      updated_by:
        type: integer
        minimum: 1
      created:
        type: string
        format: date-time
      updated:
        type: string
        format: date-time

  PolicyGuardrailRevision:
    type: object
    required: [id, scope, revision, source_yaml, fingerprint, compiler_version, published_by, created]
    properties:
      id:
        type: integer
        minimum: 1
      scope:
        type: string
        enum: [global, project]
      project_id:
        type: integer
        minimum: 1
      revision:
        type: integer
        minimum: 1
      parent_revision:
        type: integer
        minimum: 1
      rollback_of_revision:
        type: integer
        minimum: 1
      rollback_reason:
        type: string
        maxLength: 512
      source_yaml:
        type: string
        maxLength: 65536
      fingerprint:
        type: string
        pattern: '^sha256:[a-f0-9]{64}$'
      compiler_version:
        type: integer
        minimum: 1
      published_by:
        type: integer
        minimum: 1
      created:
        type: string
        format: date-time

  PolicyGuardrailState:
    type: object
    required: [draft]
    properties:
      draft:
        $ref: '#/definitions/PolicyGuardrailDraft'
      active:
        $ref: '#/definitions/PolicyGuardrailRevision'

  PolicyGuardrailDraftRequest:
    type: object
    additionalProperties: false
    required: [source_yaml, expected_revision]
    properties:
      source_yaml:
        type: string
        maxLength: 65536
      expected_revision:
        type: integer
        minimum: 1

  PolicyGuardrailSourceRequest:
    type: object
    additionalProperties: false
    required: [source_yaml]
    properties:
      source_yaml:
        type: string
        maxLength: 65536

  PolicyGuardrailValidation:
    type: object
    required: [valid, rule_count, issues]
    properties:
      valid:
        type: boolean
      fingerprint:
        type: string
        pattern: '^sha256:[a-f0-9]{64}$'
      rule_count:
        type: integer
        minimum: 0
        maximum: 32
      issues:
        type: array
        items:
          type: object
          properties:
            code:
              type: string
            path:
              type: string
            message:
              type: string

  PolicyGuardrailEvaluationInput:
    type: object
    additionalProperties: false
    required: [project_id, intent, evaluated_at, environment_ids, runner, executor, credentials]
    properties:
      project_id:
        type: integer
        minimum: 1
      intent:
        type: string
        enum: [task, workflow]
      evaluated_at:
        type: string
        format: date-time
      template:
        type: object
        description: Value-free task template identity and shape metadata.
      inventory:
        type: object
        description: Value-free inventory identity and shape metadata.
      environment_ids:
        type: array
        maxItems: 256
        items:
          type: integer
          minimum: 1
      workflow:
        type: object
        description: Value-free workflow, revision, node, and trigger metadata.
      runner:
        type: object
        description: Value-free requested and provisional runner placement metadata.
      executor:
        type: object
        description: Executor and image-reference metadata without credentials or mutable values.
      credentials:
        type: array
        maxItems: 256
        items:
          type: object
          required: [id, scope, binding_target]
          properties:
            id:
              type: integer
              minimum: 1
            scope:
              type: string
            binding_target:
              type: string

  PolicyGuardrailEvaluation:
    type: object
    required: [revisions, findings, allowed, input_fingerprint, evaluated_at]
    properties:
      revisions:
        type: array
        maxItems: 2
        items:
          type: object
          properties:
            scope:
              type: string
              enum: [global, project]
            project_id:
              type: integer
              minimum: 1
            revision:
              type: integer
              minimum: 1
            fingerprint:
              type: string
      findings:
        type: array
        maxItems: 64
        items:
          type: object
          properties:
            scope:
              type: string
              enum: [global, project]
            revision:
              type: integer
              minimum: 1
            rule_id:
              type: string
            effect:
              type: string
              enum: [allow, warn, deny]
            severity:
              type: string
              enum: [info, low, medium, high, critical]
            message:
              type: string
            remediation_url:
              type: string
              format: uri
            node_id:
              type: integer
              minimum: 1
      allowed:
        type: boolean
      input_fingerprint:
        type: string
      evaluated_at:
        type: string
        format: date-time

  PolicyGuardrailFixtureRequest:
    type: object
    additionalProperties: false
    required: [input]
    properties:
      source_yaml:
        type: string
        maxLength: 65536
      input:
        $ref: '#/definitions/PolicyGuardrailEvaluationInput'

  PolicyGuardrailImpactRequest:
    type: object
    additionalProperties: false
    required: [inputs]
    properties:
      inputs:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: '#/definitions/PolicyGuardrailEvaluationInput'

  PolicyGuardrailImpact:
    type: object
    required: [evaluations, allowed, denied]
    properties:
      evaluations:
        type: array
        maxItems: 100
        items:
          $ref: '#/definitions/PolicyGuardrailEvaluation'
      allowed:
        type: integer
        minimum: 0
      denied:
        type: integer
        minimum: 0

  PolicyGuardrailPublishRequest:
    type: object
    additionalProperties: false
    required: [expected_draft_revision]
    properties:
      expected_draft_revision:
        type: integer
        minimum: 1

  PolicyGuardrailRollbackRequest:
    type: object
    additionalProperties: false
    required: [revision, expected_draft_revision, reason]
    properties:
      revision:
        type: integer
        minimum: 1
      expected_draft_revision:
        type: integer
        minimum: 1
      reason:
        type: string
        minLength: 1
        maxLength: 512

  PolicyGuardrailDiff:
    type: object
    required: [from_revision, to_revision, added, removed, changed]
    properties:
      from_revision:
        type: integer
        minimum: 1
      to_revision:
        type: integer
        minimum: 1
      added:
        type: array
        items:
          type: string
      removed:
        type: array
        items:
          type: string
      changed:
        type: array
        items:
          type: string

  PolicyGuardrailEvaluationRecord:
    type: object
    required: [id, project_id, intent, source, input_fingerprint, decision, evaluated_at, created]
    properties:
      id:
        type: integer
        minimum: 1
      project_id:
        type: integer
        minimum: 1
      intent:
        type: string
        enum: [task, workflow]
      source:
        type: string
      template_id:
        type: integer
        minimum: 1
      workflow_template_id:
        type: integer
        minimum: 1
      workflow_run_id:
        type: integer
        minimum: 1
      workflow_run_node_id:
        type: integer
        minimum: 1
      task_id:
        type: integer
        minimum: 1
      input_fingerprint:
        type: string
      decision:
        type: string
        enum: [allow, deny]
      evaluated_at:
        type: string
        format: date-time
      created:
        type: string
        format: date-time

  Option:
    type: object
    properties:
      key:
        type: string
        example: "nav.unpinnedItems"
      value:
        type: string
        example: "[\"dashboard\",\"history\"]"

  Pong:
    type: string
    x-example: pong

  Login:
    type: object
    properties:
      auth:
        type: string
        description: Username/Email address
        x-example: user@semaphoreui.com
      password:
        type: string
        format: password
        description: Password

  LoginMetadata:
    type: object
    properties:
      oidc_providers:
        type: array
        description: List of OIDC providers
        items:
          type: object
          properties:
            id:
              type: string
              description: ID of the provider, used in the login URL
              x-example: mysso
            name:
              type: string
              description: Text to show on the login button
              x-example: Sign in with MySSO

  UserRequest:
    type: object
    properties:
      name:
        type: string
        x-example: Integration Test User
        example: Integration Test User
      username:
        type: string
        x-example: test-user
        example: test-user
      email:
        type: string
        x-example: test@ansiblesemaphore.test
        example: test@ansiblesemaphore.test
      password:
        type: string
        format: password
      alert:
        type: boolean
      admin:
        type: boolean
      external:
        type: boolean

  UserPutRequest:
    type: object
    properties:
      name:
        type: string
        x-example: Integration Test User2
        example: Integration Test User2
      username:
        type: string
        x-example: test-user2
        example: test-user2
      email:
        type: string
        x-example: test2@ansiblesemaphore.test
        example: test2@ansiblesemaphore.test
      alert:
        type: boolean
      admin:
        type: boolean

  User:
    type: object
    properties:
      id:
        type: integer
        minimum: 1
      name:
        type: string
      username:
        type: string
      email:
        type: string
      created:
        type: string
      alert:
        type: boolean
      admin:
        type: boolean
      external:
        type: boolean

  ProjectUser:
    type: object
    properties:
      id:
        type: integer
        minimum: 1
      name:
        type: string
      username:
        type: string
      role:
        type: string
        enum: [owner, manager, task_runner, guest]

  ProjectInvite:
    type: object
    properties:
      id:
        type: integer
        minimum: 1
      project_id:
        type: integer
        minimum: 1
      user_id:
        type: integer
        minimum: 1
        description: User ID for user-based invites (optional)
      email:
        type: string
        format: email
        description: Email address for email-based invites (optional)
      role:
        type: string
        enum: [owner, manager, task_runner, guest]
        example: manager
      status:
        type: string
        enum: [pending, accepted, declined, expired]
        example: pending
      inviter_user_id:
        type: integer
        minimum: 1
        description: ID of the user who created the invite
      created:
        type: string
        format: date-time
        description: When the invite was created
      expires_at:
        type: string
        format: date-time
        description: When the invite expires (optional)
      accepted_at:
        type: string
        format: date-time
        description: When the invite was accepted (optional)
      inviter_user:
        $ref: "#/definitions/User"
        description: Details of the user who created the invite
      user:
        $ref: "#/definitions/User"
        description: Details of the invited user (for user-based invites)

  ProjectInviteRequest:
    type: object
    properties:
#      user_id:
#        type: integer
#        minimum: 1
#        description: User ID to invite (use either user_id or email, not both)
      email:
        type: string
        format: email
        description: Email address to invite (use either user_id or email, not both)
        x-example: user@example.com
      role:
        type: string
        enum: [owner, manager, task_runner, guest]
        example: manager
      expires_at:
        type: string
        format: date-time
        description: When the invite should expire (optional, defaults to 7 days)
    required:
      - role

  AcceptInviteRequest:
    type: object
    properties:
      token:
        type: string
        description: The invitation token
        x-example: "a1b2c3d4e5f6..."
    required:
      - token

  ProjectBackup:
    type: object
    example: {"meta":{"name":"homelab","alert":true,"alert_chat":"Test","max_parallel_tasks":0,"type":null},"templates":[{"inventory":"Build","repository":"Demo","environment":"Empty","name":"Build","playbook":"build.yml","app":"ansible","working_directory":".","arguments":"[]","allow_override_args_in_task":false,"description":"Build Job","vault_key":null,"type":"build","start_version":"1.0.0","build_template":null,"view":"Build","autorun":false,"survey_vars":[],"suppress_success_alerts":false,"cron":"* * * * *"}],"repositories":[{"name":"Demo","git_url":"https://github.com/semaphoreui/semaphore-demo.git","git_branch":"main","ssh_key":"None"}],"keys":[{"name":"None","type":"none"},{"name":"Vault Password","type":"login_password"}],"views":[{"title":"Build","position":0}],"inventories":[{"name":"Build","inventory":"","ssh_key":"None","become_key":"None","type":"static"},{"name":"Dev","inventory":"","ssh_key":"None","become_key":"None","type":"file"},{"name":"Prod","inventory":"","ssh_key":"None","become_key":"None","type":"file"}],"environments":[{"name":"Empty","password":null,"json":"{}","env":null}]}
    properties:
      meta:
        type: object
        properties:
          name:
            type: string
          alert:
            type: boolean
          alert_chat:
            type: string
          max_parallel_tasks:
            type: integer
            minimum: 0
          type:
            type: string
      templates:
        type: array
        items:
          type: object
          properties:
            inventory:
              type: string
            repository:
              type: string
            environment:
              type: string
            view:
              type: string
            name:
              type: string
            playbook:
              type: string
            app:
              type: string
              example: ansible
            working_directory:
              type: string
              description: >-
                Repository-relative working directory for Ansible commands. It is
                valid only for Ansible templates and must stay inside the repository.
              x-nullable: true
            arguments:
              type: string
            description:
              type: string
            allow_override_args_in_task:
              type: boolean
            suppress_success_alerts:
              type: boolean
            cron:
              type: string
            build_template:
              type: string
            autorun:
              type: boolean
            survey_vars:
              type: string
            start_version:
              type: string
            type:
              type: string
            vault_key:
              type: string
            allow_override_branch_in_task:
              type: boolean
      repositories:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            git_url:
              type: string
            git_branch:
              type: string
            ssh_key:
              type: string
      keys:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
              enum: [ssh, login_password, none]
      views:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            position:
              type: integer
              minimum: 0
      inventories:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            inventory:
              type: string
            ssh_key:
              type: string
            become_key:
              type: string
            type:
              type: string
              enum: [static, static-yaml, file]
      environments:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            password:
              type: string
            json:
              type: string
            env:
              type: string

  APIToken:
    type: object
    properties:
      id:
        type: string
      created:
        type: string
      #        pattern: ^\d{4}-(?:0[0-9]{1}|1[0-2]{1})-[0-9]{2}T\d{2}:\d{2}:\d{2}Z$
      expired:
        type: boolean
      user_id:
        type: integer
        minimum: 1
      name:
        type: string

  ProjectRequest:
    type: object
    properties:
      name:
        type: string
        example: Test
      alert:
        type: boolean
      alert_chat:
        type: string
        x-nullable: true
        example: Test
      max_parallel_tasks:
        type: integer
        minimum: 0
      type:
        type: string
      demo:
        description: Create Demo project resources?
        type: boolean

  Project:
    type: object
    properties:
      id:
        type: integer
        minimum: 1
      name:
        type: string
        example: Test
      created:
        type: string
      #        pattern: ^\d{4}-(?:0[0-9]{1}|1[0-2]{1})-[0-9]{2}T\d{2}:\d{2}:\d{2}Z$
      alert:
        type: boolean
      alert_chat:
        type: string
        x-nullable: true
        example: Test
      max_parallel_tasks:
        type: integer
        minimum: 0
      type:
        type: string

  AccessKeyRequest:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
        x-example: None
        example: None
      type:
        type: string
        enum: [none, ssh, login_password]
        x-example: none
      project_id:
        type: integer
        minimum: 1
        x-example: 2
      override_secret:
        type: boolean
      login_password:
        type: object
        properties:
          password:
            type: string
            x-example: password
            example: password
          login:
            type: string
            x-example: username
            example: username
      ssh:
        type: object
        properties:
          login:
            type: string
            x-example: user
            example: user
          passphrase:
            type: string
            x-example: passphrase
            example: passphrase
          private_key:
            type: string
            x-example: private key
            example: private key

  AccessKey:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
        example: Test
      type:
        type: string
        enum: [none, ssh, login_password]
      project_id:
        type: integer
      generated_ssh_key:
        $ref: "#/definitions/GeneratedSSHKeyMetadata"

  GeneratedSSHKeyMetadata:
    type: object
    required: [public_key, fingerprint, algorithm]
    properties:
      public_key:
        type: string
        description: Public key in authorized_keys-compatible OpenSSH format.
      fingerprint:
        type: string
        description: OpenSSH SHA-256 public-key fingerprint.
      algorithm:
        type: string
        enum: [ed25519, rsa-3072]

  GeneratedSSHKeyCreateRequest:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
      login:
        type: string
      algorithm:
        type: string
        default: ed25519
        enum: [ed25519, rsa-3072]

  GeneratedSSHKeyRotateRequest:
    type: object
    required: [confirm_rotation]
    additionalProperties: false
    properties:
      algorithm:
        type: string
        default: ed25519
        enum: [ed25519, rsa-3072]
      confirm_rotation:
        type: boolean
        enum: [true]

  GeneratedSSHKeyResponse:
    type: object
    required: [key, public_key, fingerprint, algorithm]
    properties:
      key:
        $ref: "#/definitions/AccessKey"
      public_key:
        type: string
        description: Public key in authorized_keys-compatible OpenSSH format.
      fingerprint:
        type: string
        description: OpenSSH SHA-256 public-key fingerprint.
      algorithm:
        type: string
        enum: [ed25519, rsa-3072]

  EnvironmentSecret:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      type:
        type: string
        enum: [env, var]

  EnvironmentSecretRequest:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
        example: Test
      secret:
        type: string
      type:
        type: string
        enum: [env, var]
      operation:
        type: string
        enum: [create, update, delete]

  EnvironmentRequest:
    type: object
    properties:
      id:
        type: integer
        example: 1
      name:
        type: string
        example: Test
      project_id:
        type: integer
        minimum: 1
      password:
        type: string
      json:
        type: string
        example: '{}'
      env:
        type: string
        example: '{}'
      secrets:
        type: array
        items:
          $ref: '#/definitions/EnvironmentSecretRequest'

  Environment:
    type: object
    properties:
      id:
        type: integer
        minimum: 1
      name:
        type: string
        example: Test
      project_id:
        type: integer
        minimum: 1
      password:
        type: string
      json:
        type: string
        example: '{}'
      env:
        type: string
        example: '{}'
      secrets:
        type: array
        items:
          $ref: '#/definitions/EnvironmentSecret'

  InventoryRequest:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
        example: Test
      project_id:
        type: integer
        minimum: 1
      inventory:
        type: string
      ssh_key_id:
        type: integer
        minimum: 1
      become_key_id:
        type: integer
        minimum: 1
      repository_id:
        type: integer
        minimum: 1
      type:
        type: string
        enum: [static, static-yaml, file, terraform-workspace]

