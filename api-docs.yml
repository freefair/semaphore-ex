        Generates an encrypted local SSH credential. The private key is never
        returned; Access Key encryption must be configured.
      parameters:
        - name: Generated SSH Key
          in: body
          required: true
          schema:
            $ref: "#/definitions/GeneratedSSHKeyCreateRequest"
      responses:
        201:
          description: SSH key generated
          schema:
            $ref: "#/definitions/GeneratedSSHKeyResponse"
        400:
          description: Invalid request, algorithm, storage, or encryption configuration
        403:
          description: Project-resource management permission required

  /project/{project_id}/keys/{key_id}:
    parameters:
      - $ref: "#/parameters/project_id"
      - $ref: "#/parameters/key_id"
    put:
      tags:
