      - $ref: '#/parameters/task_id'
    get:
      tags:
        - task
      summary: Get the persisted Ansible task summary
      description: >-
        Returns the project-scoped normalized summary without reparsing task logs.
        Missing or interrupted terminal summaries are repaired from persisted events.
      responses:
        200:
          description: Persisted task summary
          schema:
            $ref: "#/definitions/TaskSummary"
        404:
          description: Project or task not found

  /project/{project_id}/tasks/{task_id}/ansible/summary/hosts:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/task_id'
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      - name: before
        in: query
        type: integer
        minimum: 1
        description: Return rows with IDs lower than this cursor
    get:
      tags:
        - task
      summary: Get a bounded page of persisted Ansible host results
      responses:
        200:
          description: Host result page
          schema:
            $ref: "#/definitions/TaskSummaryHostPage"
        404:
          description: Project or task not found

  /project/{project_id}/tasks/{task_id}/ansible/summary/stages:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/task_id'
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      - name: before
        in: query
        type: integer
        minimum: 1
        description: Return stage groups with event IDs lower than this cursor
    get:
      tags:
        - task
      summary: Get a bounded page of persisted Ansible stage results
      responses:
        200:
          description: Stage result page
          schema:
            $ref: "#/definitions/TaskSummaryStagePage"
        404:
          description: Project or task not found

  /project/{project_id}/tasks/{task_id}/ansible/summary/errors:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/task_id'
      - name: count
        in: query
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      - name: before
        in: query
        type: integer
        minimum: 1
        description: Return rows with IDs lower than this cursor
    get:
      tags:
        - task
      summary: Get a bounded page of redacted Ansible failures
      responses:
        200:
          description: Error result page
          schema:
            $ref: "#/definitions/TaskSummaryErrorPage"
        404:
          description: Project or task not found

  /apps:
    get:
      summary: Get apps
      responses:
        200:
          description: Apps
          schema:
            type: array
            items:
              $ref: "#/definitions/App"

  /project/{project_id}/notifications/test:
    post:
      tags:
        - project
      summary: Send test notification
      description: Sends a test notification to all enabled messengers for the project
      parameters:
        - $ref: "#/parameters/project_id"
      responses:
        409:
          description: Alerts not enabled for the project
#        204:
#          description: Test notification dispatched (or alerts disabled)

  # project runners
  /project/{project_id}/runners:
    parameters:
      - $ref: "#/parameters/project_id"
    get:
      tags:
        - runner
      summary: Get project runners
      description: Returns runners owned by the project together with global runners that have tags.
      responses:
        200:
          description: Runners
          schema:
            type: array
            items:
              $ref: "#/definitions/Runner"
    post:
      tags:
        - runner
      summary: Add project runner
      parameters:
        - name: Runner
          in: body
          required: true
          schema:
            $ref: "#/definitions/RunnerRequest"
      responses:
        201:
          description: Runner created
          schema:
            $ref: "#/definitions/RunnerWithToken"
        400:
          description: Invalid request body or mismatched project ID
        403:
          description: Plan does not allow adding more runners

  /project/{project_id}/runner_tags:
    parameters:
      - $ref: "#/parameters/project_id"
    get:
      tags:
        - runner
      summary: Get project runner tags
      responses:
        200:
          description: Runner tags
          schema:
            type: array
            items:
              $ref: "#/definitions/RunnerTag"

  /project/{project_id}/runners/{runner_id}:
    parameters:
      - $ref: "#/parameters/project_id"
      - $ref: "#/parameters/runner_id"
    get:
      tags:
        - runner
      summary: Get project runner
      responses:
        200:
          description: Runner
          schema:
            $ref: "#/definitions/Runner"
        404:
          description: Runner not found
    put:
      tags:
        - runner
      summary: Update project runner
      parameters:
        - name: Runner
          in: body
          required: true
          schema:
            $ref: "#/definitions/RunnerRequest"
      responses:
        204:
          description: Runner updated
        400:
          description: Invalid request body or mismatched project ID
    delete:
      tags:
        - runner
      summary: Delete project runner
      responses:
        204:
          description: Runner deleted

  /project/{project_id}/runners/{runner_id}/active:
    parameters:
      - $ref: "#/parameters/project_id"
      - $ref: "#/parameters/runner_id"
    post:
      tags:
        - runner
      summary: Set project runner active state
      parameters:
        - name: Active
          in: body
          required: true
          schema:
            $ref: "#/definitions/RunnerActive"
      responses:
        204:
          description: Runner active state updated
        400:
          description: Invalid request body

  /project/{project_id}/runners/{runner_id}/registration-token:
    parameters:
      - $ref: "#/parameters/project_id"
      - $ref: "#/parameters/runner_id"
    post:
      tags:
        - runner
      summary: Regenerate the one-time registration token of an unregistered project runner
      responses:
        200:
          description: New registration token
          schema:
            $ref: "#/definitions/RunnerRegistrationToken"
        400:
          description: Runner is already registered

  /project/{project_id}/runners/{runner_id}/cache:
    parameters:
      - $ref: "#/parameters/project_id"
      - $ref: "#/parameters/runner_id"
    delete:
      tags:
        - runner
      summary: Clear project runner cache
      responses:
        204:
          description: Runner cache cleared

  # global runners (admin)
  /runners:
    get:
      tags:
        - runner
      summary: Get all global runners
      responses:
        200:
          description: Runners
          schema:
            type: array
            items:
              $ref: "#/definitions/Runner"
    post:
      tags:
        - runner
      summary: Add global runner
      parameters:
        - name: Runner
          in: body
          required: true
          schema:
            $ref: "#/definitions/RunnerRequest"
      responses:
        201:
          description: Runner created
          schema:
            $ref: "#/definitions/RunnerWithToken"
        400:
          description: Runner not created

  /runner_tags:
    get:
      tags:
        - runner
      summary: Get global runner tags
      responses:
        200:
          description: Runner tags
          schema:
            type: array
            items:
              $ref: "#/definitions/RunnerTag"

  /runners/{runner_id}:
    parameters:
      - $ref: "#/parameters/global_runner_id"
    get:
      tags:
        - runner
      summary: Get global runner
      responses:
        200:
          description: Runner
          schema:
            $ref: "#/definitions/Runner"
        404:
          description: Runner not found
    put:
      tags:
        - runner
      summary: Update global runner
      parameters:
        - name: Runner
          in: body
          required: true
          schema:
            $ref: "#/definitions/RunnerRequest"
      responses:
        204:
          description: Runner updated
        400:
          description: Runner not updated
    delete:
      tags:
        - runner
      summary: Delete global runner
      responses:
        204:
          description: Runner deleted

  /runners/{runner_id}/active:
    parameters:
      - $ref: "#/parameters/global_runner_id"
    post:
      tags:
        - runner
      summary: Set global runner active state
      parameters:
        - name: Active
          in: body
          required: true
          schema:
            $ref: "#/definitions/RunnerActive"
      responses:
        204:
          description: Runner active state updated
        400:
          description: Invalid request body

  /runners/{runner_id}/registration-token:
    parameters:
      - $ref: "#/parameters/global_runner_id"
    post:
      tags:
        - runner
      summary: Regenerate the one-time registration token of an unregistered global runner
      responses:
        200:
          description: New registration token
          schema:
            $ref: "#/definitions/RunnerRegistrationToken"
        400:
          description: Runner is already registered

  /runners/{runner_id}/cache:
    parameters:
      - $ref: "#/parameters/global_runner_id"
    delete:
      tags:
        - runner
      summary: Clear global runner cache
      responses:
        204:
          description: Runner cache cleared

  /global-credentials:
    get:
      tags: [global-credential]
      summary: List global credential summaries
      description: Requires global audit or any global credential metadata, rotation, or grant permission. Values and external reference coordinates are never returned.
      parameters:
        - name: count
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        - name: offset
          in: query
          type: integer
          minimum: 0
          default: 0
      responses:
        200:
          description: Bounded value-free summaries
          schema:
            type: array
            items:
              $ref: "#/definitions/GlobalCredentialSummary"
        400:
          description: Invalid or ambiguous pagination
        403:
          description: Missing global credential permission
    post:
      tags: [global-credential]
      summary: Create a global credential and its first immutable version
      description: Requires both global.credentials.metadata.manage and global.credentials.rotate. Material is write-only.
      parameters:
        - name: Credential
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialCreateRequest"
      responses:
        201:
          description: Value-free credential summary
          schema:
            $ref: "#/definitions/GlobalCredentialSummary"
        400:
          description: Invalid input
        403:
          description: Either required permission is missing
        503:
          description: Local material encryption is unavailable

  /global-credentials/grant-projects:
    get:
      tags: [global-credential]
      summary: List bounded project grant targets
      description: Requires global.credentials.grant and returns at most 200 projects with only ID and name.
      responses:
        200:
          description: Ordered project selectors
          schema:
            type: array
            items:
              $ref: "#/definitions/GlobalCredentialGrantProject"
        403:
          description: Missing global.credentials.grant

  /global-credentials/{credential_id}:
    parameters:
      - $ref: "#/parameters/credential_id"
    get:
      tags: [global-credential]
      summary: Get detailed global credential metadata
      description: Requires global.credentials.metadata.manage. Local material and ciphertext are always omitted.
      responses:
        200:
          description: Detailed value-free metadata
          schema:
            $ref: "#/definitions/GlobalCredentialDetail"
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
    put:
      tags: [global-credential]
      summary: Update global credential display metadata
      description: Requires global.credentials.metadata.manage. Material cannot be included.
      parameters:
        - name: Metadata
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialMetadataUpdateRequest"
      responses:
        200:
          description: Updated value-free summary
          schema:
            $ref: "#/definitions/GlobalCredentialSummary"
        400:
          description: Invalid input
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
        409:
          description: Stale revision
    delete:
      tags: [global-credential]
      summary: Delete a disabled, ungranted global credential
      description: Requires global.credentials.metadata.manage. The credential must be disabled and have no grants.
      parameters:
        - name: expected_revision
          in: query
          required: true
          type: integer
          minimum: 1
          x-example: 1
      responses:
        204:
          description: Credential deleted
        400:
          description: Invalid or ambiguous revision
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
        409:
          description: Stale revision or dependency guard

  /global-credentials/{credential_id}/enabled:
    parameters:
      - $ref: "#/parameters/credential_id"
    post:
      tags: [global-credential]
      summary: Enable or disable a global credential
      description: Requires global.credentials.metadata.manage and records the explicit reversible transition.
      parameters:
        - name: State
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialEnabledRequest"
      responses:
        200:
          description: Updated value-free summary
          schema:
            $ref: "#/definitions/GlobalCredentialSummary"
        400:
          description: Invalid input
        403:
          description: Missing metadata-management permission
        404:
          description: Credential not found
        409:
          description: Stale revision

  /global-credentials/{credential_id}/rotate:
    parameters:
      - $ref: "#/parameters/credential_id"
    post:
      tags: [global-credential]
      summary: Append a new immutable credential version
      description: Requires global.credentials.rotate. New material is write-only and the response contains only a random opaque fingerprint.
      parameters:
        - name: Rotation
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialRotateRequest"
      responses:
        200:
          description: Rotated value-free summary
          schema:
            $ref: "#/definitions/GlobalCredentialSummary"
        400:
          description: Invalid input
        403:
          description: Missing rotation permission
        404:
          description: Credential not found
        409:
          description: Stale revision
        503:
          description: Local material encryption is unavailable

  /global-credentials/{credential_id}/usage:
    parameters:
      - $ref: "#/parameters/credential_id"
    get:
      tags: [global-credential, audit]
      summary: List value-free credential resolution history
      description: Requires global.audit.read. Material and external provider coordinates are never returned.
      parameters:
        - name: count
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        - name: before_id
          in: query
          type: integer
          minimum: 1
        - name: project_id
          in: query
          type: integer
          minimum: 1
        - name: task_id
          in: query
          type: integer
          minimum: 1
        - name: outcome
          in: query
          type: string
          enum: [allowed, denied, failure]
      responses:
        200:
          description: Bounded newest-first usage history
          schema:
            type: array
            items:
              $ref: "#/definitions/GlobalCredentialUsage"
        400:
          description: Invalid or ambiguous filters
        403:
          description: Missing global.audit.read
        404:
          description: Credential not found

  /global-credentials/{credential_id}/impact:
    parameters:
      - $ref: "#/parameters/credential_id"
    get:
      tags: [global-credential]
      summary: Preview credential transition impact
      description: Requires any global credential administration or audit permission.
      responses:
        200:
          description: Value-free usage and active-grant counts
          schema:
            $ref: "#/definitions/GlobalCredentialImpact"
        403:
          description: Missing global credential permission
        404:
          description: Credential not found

  /global-credentials/{credential_id}/grants:
    parameters:
      - $ref: "#/parameters/credential_id"
    get:
      tags: [global-credential]
      summary: List project grants for one credential
      description: Requires global.credentials.grant.
      parameters:
        - name: count
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        - name: offset
          in: query
          type: integer
          minimum: 0
          default: 0
      responses:
        200:
          description: Credential grants
          schema:
            type: array
            items:
              $ref: "#/definitions/GlobalCredentialGrant"
        403:
          description: Missing grant permission
    post:
      tags: [global-credential]
      summary: Grant a project explicit operations on one credential
      description: Requires global.credentials.grant. One grant per credential/project pair is allowed.
      parameters:
        - name: Grant
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialGrantInput"
      responses:
        201:
          description: Grant created
          schema:
            $ref: "#/definitions/GlobalCredentialGrant"
        400:
          description: Invalid input
        403:
          description: Missing grant permission
        404:
          description: Credential not found
        409:
          description: Grant already exists or a dependency changed

  /global-credentials/{credential_id}/grants/{grant_id}:
    parameters:
      - $ref: "#/parameters/credential_id"
      - $ref: "#/parameters/grant_id"
    put:
      tags: [global-credential]
      summary: Update allowed operations or expiry
      description: Requires global.credentials.grant and preserves the current grant status.
      parameters:
        - name: Grant
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialGrantUpdateRequest"
      responses:
        200:
          description: Grant updated
          schema:
            $ref: "#/definitions/GlobalCredentialGrant"
        400:
          description: Invalid input
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision
    delete:
      tags: [global-credential]
      summary: Delete a revoked grant
      description: Requires global.credentials.grant. Active grants must be revoked first.
      parameters:
        - name: expected_revision
          in: query
          required: true
          type: integer
          minimum: 1
          x-example: 1
      responses:
        204:
          description: Grant deleted
        400:
          description: Invalid input or active grant
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision

  /global-credentials/{credential_id}/grants/{grant_id}/revoke:
    parameters:
      - $ref: "#/parameters/credential_id"
      - $ref: "#/parameters/grant_id"
    post:
      tags: [global-credential]
      summary: Revoke a project grant
      description: Requires global.credentials.grant. Revocation is explicit and reversible.
      parameters:
        - name: Revision
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialRevisionRequest"
      responses:
        200:
          description: Revoked grant
          schema:
            $ref: "#/definitions/GlobalCredentialGrant"
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision

  /global-credentials/{credential_id}/grants/{grant_id}/restore:
    parameters:
      - $ref: "#/parameters/credential_id"
      - $ref: "#/parameters/grant_id"
    post:
      tags: [global-credential]
      summary: Restore a revoked project grant
      description: Requires global.credentials.grant.
      parameters:
        - name: Revision
          in: body
          required: true
          schema:
            $ref: "#/definitions/GlobalCredentialRevisionRequest"
      responses:
        200:
          description: Restored grant
          schema:
            $ref: "#/definitions/GlobalCredentialGrant"
        403:
          description: Missing grant permission
        404:
          description: Grant not found for this credential
        409:
          description: Stale grant revision

  /project/{project_id}/granted-credentials:
    parameters:
      - $ref: "#/parameters/project_id"
    get:
      tags: [global-credential, project]
      summary: List effective granted credential metadata for one project
      description: Requires project.credentials.granted.list. Only enabled credentials with active, unexpired reference grants are returned.
      parameters:
        - name: count
          in: query
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        - name: offset
          in: query
          type: integer
          minimum: 0
          default: 0
      responses:
        200:
          description: Value-free effective project metadata
          schema:
            type: array
            items:
              $ref: "#/definitions/GrantedCredential"
        400:
          description: Invalid or ambiguous pagination
        403:
          description: Missing project.credentials.granted.list
        404:
          description: Project not found or not visible

  # enhanced policy guardrails
  /project/{project_id}/policy-guardrails:
    parameters:
      - $ref: '#/parameters/project_id'
    get:
      tags: [policy-guardrail, project]
      summary: Read the project policy draft and active revision
      description: Requires the policy_guardrails read capability and project.policy_guardrails.manage.
      responses:
        200:
          description: Current draft and optional active immutable revision
          schema:
            $ref: '#/definitions/PolicyGuardrailState'
        403:
          description: Missing project policy-management permission
        404:
          description: Capability unavailable or project hidden

  /project/{project_id}/policy-guardrails/draft:
    parameters:
      - $ref: '#/parameters/project_id'
    put:
      tags: [policy-guardrail, project]
      summary: Save a project policy draft using optimistic concurrency
      parameters:
        - name: draft
          in: body
          required: true
          schema:
            $ref: '#/definitions/PolicyGuardrailDraftRequest'
      responses:
        200:
          description: Saved draft with its next revision
          schema:
            $ref: '#/definitions/PolicyGuardrailDraft'
        400:
          description: Invalid or ambiguous input
        403:
          description: Missing project policy-management permission
        409:
          description: Draft revision conflict
        413:
          description: Request or YAML source exceeds its bound

  /project/{project_id}/policy-guardrails/validate:
    parameters:
      - $ref: '#/parameters/project_id'
    post:
      tags: [policy-guardrail, project]
      summary: Validate and fingerprint project policy YAML without saving it
      parameters:
        - name: source
          in: body
          required: true
          schema:
            $ref: '#/definitions/PolicyGuardrailSourceRequest'
      responses:
        200:
          description: Bounded validation result
          schema:
            $ref: '#/definitions/PolicyGuardrailValidation'
        400:
          description: Invalid request shape
        403:
          description: Missing project policy-management permission
        413:
          description: Request or YAML source exceeds its bound

  /project/{project_id}/policy-guardrails/test:
    parameters:
      - $ref: '#/parameters/project_id'
    post:
      tags: [policy-guardrail, project]
      summary: Evaluate policy YAML against one value-free project fixture
      parameters:
        - name: fixture
          in: body
          required: true
          schema:
            $ref: '#/definitions/PolicyGuardrailFixtureRequest'
      responses:
        200:
          description: Deterministic evaluation
          schema:
            $ref: '#/definitions/PolicyGuardrailEvaluation'
        400:
          description: Invalid policy, fixture, or project scope
        403:
          description: Missing project policy-management permission
        413:
          description: Request exceeds 2 MiB or YAML exceeds 64 KiB

  /project/{project_id}/policy-guardrails/diff:
    parameters:
      - $ref: '#/parameters/project_id'
      - name: from_revision
        in: query
        required: true
        type: integer
        minimum: 1
        x-example: 1
