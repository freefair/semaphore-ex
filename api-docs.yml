        type: integer
        minimum: 1
      version_fingerprint:
        type: string
        pattern: '^[a-f0-9]{64}$'
      provider_version:
        type: integer
        minimum: 0
      target:
        type: string
        maxLength: 128

  WorkflowArtifactRetentionSnapshot:
    type: object
    description: Immutable policy provenance and limits captured when the artifact is created.
    required: [global_revision, retention_seconds, max_artifact_bytes, max_run_bytes]
    properties:
      global_revision:
        type: integer
        minimum: 0
      project_revision:
        type: integer
        minimum: 0
      retention_seconds:
        type: integer
        format: int64
        minimum: 3600
        maximum: 315360000
      max_artifact_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      max_run_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 268435456

  WorkflowFileArtifact:
    type: object
    description: Immutable file metadata and value-free provenance. Binary content is never embedded.
    required: [id, project_id, workflow_template_id, workflow_run_id, workflow_node_id, workflow_definition_revision, task_id, attempt, logical_name, filename, media_type, size_bytes, uploaded_bytes, sha256, state, revision, producer_user_id, producer_template_id, producer_version, access_policy, retention, created_at]
    properties:
      id:
        type: integer
        minimum: 1
      project_id:
        type: integer
        minimum: 1
      workflow_template_id:
        type: integer
        minimum: 1
      workflow_run_id:
        type: integer
        minimum: 1
      workflow_node_id:
        type: integer
        minimum: 1
      workflow_definition_revision:
        type: integer
        minimum: 1
      task_id:
        type: integer
        minimum: 1
      attempt:
        type: integer
        minimum: 0
      logical_name:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      filename:
        type: string
        minLength: 1
        maxLength: 255
      media_type:
        type: string
        minLength: 3
        maxLength: 128
      size_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      uploaded_bytes:
        type: integer
        format: int64
        minimum: 0
        maximum: 67108864
      sha256:
        type: string
        pattern: '^[a-f0-9]{64}$'
      state:
        type: string
        enum: [staging, available, failed, expired, deleted]
      revision:
        type: integer
        minimum: 1
      producer_user_id:
        type: integer
        minimum: 1
      producer_runner_id:
        type: integer
        minimum: 1
      producer_template_id:
        type: integer
        minimum: 1
      producer_version:
        type: string
        minLength: 1
        maxLength: 128
      credential_provenance:
        type: array
        maxItems: 64
        items:
          $ref: '#/definitions/WorkflowFileArtifactCredentialProvenance'
      access_policy:
        $ref: '#/definitions/WorkflowFileArtifactAccessPolicy'
      retention:
        $ref: '#/definitions/WorkflowArtifactRetentionSnapshot'
      created_at:
        type: string
        format: date-time
      finalized_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      deleted_at:
        type: string
        format: date-time

  WorkflowFileArtifactUpload:
    type: object
    additionalProperties: false
    required: [workflow_node_id, task_id, attempt, logical_name, filename, media_type, size_bytes, sha256, access_policy]
    properties:
      workflow_node_id:
        type: integer
        minimum: 1
      task_id:
        type: integer
        minimum: 1
      attempt:
        type: integer
        minimum: 0
      logical_name:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      filename:
        type: string
        minLength: 1
        maxLength: 255
      media_type:
        type: string
        minLength: 3
        maxLength: 128
      size_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      sha256:
        type: string
        pattern: '^[a-f0-9]{64}$'
      access_policy:
        $ref: '#/definitions/WorkflowFileArtifactAccessPolicy'

  WorkflowArtifactRetentionPolicy:
