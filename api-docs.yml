        items:
          type: string
          maxLength: 64

  WorkflowFileArtifactCredentialProvenance:
    type: object
    description: Value-free credential reference captured from the producing task attempt.
    required: [credential_id, grant_id, credential_version, version_fingerprint, target]
    properties:
      credential_id:
        type: integer
        minimum: 1
      grant_id:
        type: integer
        minimum: 1
