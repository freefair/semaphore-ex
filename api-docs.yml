      credential:
        type: string
        format: password
        maxLength: 4096
        description: Optional write-only legacy Bearer credential. Omit to preserve it or send an empty string to remove it.

  AuditWebhookConfiguration:
    type: object
    required: [endpoint, credential_configured, paused, signing_revision]
    properties:
      endpoint:
        type: string
        format: uri
      credential_configured:
        type: boolean
      paused:
        type: boolean
      updated_at:
        type: string
        format: date-time
      current_key_id:
        type: string
      next_key_id:
        type: string
      current_generation:
        type: integer
      next_generation:
        type: integer
      signing_revision:
        type: integer

  AuditWebhookDelivery:
    type: object
    required: [id, event_id, status, attempts, created_at, updated_at]
    properties:
      id:
        type: integer
      event_id:
        type: string
        minLength: 16
        maxLength: 128
      status:
        type: string
        enum: [pending, delivering, retrying, succeeded, failed]
      attempts:
        type: integer
        minimum: 0
      next_attempt:
        type: string
        format: date-time
      http_status:
        type: integer
      last_error:
        type: string
        description: Bounded reason code; never a raw transport error or response body.
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      delivered_at:
        type: string
        format: date-time

  AuditWebhookDeliveryAttempt:
    type: object
    description: Redacted attempt metadata; payloads, credentials, signatures, headers, bodies, and raw errors are omitted.
    required: [id, delivery_id, event_id, attempt, key_id, signed_at, outcome, created_at]
    properties:
      id:
        type: integer
