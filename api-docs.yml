        type: integer
        format: int64
        minimum: 3600
        maximum: 315360000
      max_artifact_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 67108864
      max_run_bytes:
        type: integer
        format: int64
        minimum: 1
        maximum: 268435456
      created_by_user_id:
        type: integer
        minimum: 1
      created_at:
        type: string
        format: date-time

  WorkflowArtifactRetentionState:
