        type: integer
      event_id:
        type: string
        minLength: 16
        maxLength: 128
      attempt:
        type: integer
        minimum: 1
      key_id:
        type: string
        pattern: '^swhkid_[-_A-Za-z0-9]+$'
      signed_at:
        type: string
        format: date-time
      outcome:
        type: string
        enum: [started, succeeded, retrying, failed]
      http_status:
        type: integer
      reason:
        type: string
        enum: [network_error, timeout, http_4xx, http_5xx, invalid_response, no_key, signing_failure, configuration_error, delivery_failed]
      created_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time

