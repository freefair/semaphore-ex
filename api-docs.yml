        pattern: '^[a-f0-9]{64}$'
      provider_version:
        type: integer
      outcome:
        type: string
        enum: [allowed, denied, failure]
      reason:
        type: string
        enum: [allowed, actor_required, task_permission_denied, consume_permission_denied, capability_unavailable, credential_unavailable, grant_unavailable, provider_unavailable, audit_unavailable, injection_failed]
      occurred_at:
        type: string
        format: date-time

  GlobalCredentialUsage:
    type: object
    required: [id, snapshot]
    properties:
      id:
        type: integer
      snapshot:
        $ref: "#/definitions/GlobalCredentialResolutionSnapshot"

  GlobalCredentialImpact:
    type: object
    description: Value-free transition preview for rotation, grant, disable, and deletion decisions.
    required: [credential_id, usage_count, project_count, active_grant_count]
    properties:
      credential_id:
        type: integer
      usage_count:
        type: integer
      project_count:
        type: integer
      active_grant_count:
        type: integer
      last_used_at:
        type: string
        format: date-time

