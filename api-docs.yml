    get:
      tags:
        - template
      summary: Get template
      parameters:
        - name: sort
          in: query
          required: true
          type: string
          description: sorting name
          enum: [name, playbook, ssh_key, inventory, environment, repository]
        - name: order
          in: query
          required: true
          type: string
          description: ordering manner
          enum: [asc, desc]
        - name: search
          in: query
          required: false
          type: string
          maxLength: 256
          description: >-
            Case-insensitive literal match over the visible template name,
            description, playbook, and runner tags. SQL wildcard characters
            have no special meaning.
        - name: count
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 200
          description: Optional page size. Omit to retain the unpaged list contract.
        - name: offset
          in: query
          required: false
          type: integer
          minimum: 0
          description: Zero-based visible-result offset; requires count.
      responses:
        200:
          description: template
          schema:
            type: array
            items:
              $ref: "#/definitions/Template"
              properties:
                survey_vars:
                  type: array
                  items:
                    $ref: "#/definitions/TemplateSurveyVar"
                last_task:
                  $ref: "#/definitions/Task"
        400:
          description: Invalid search or pagination query
