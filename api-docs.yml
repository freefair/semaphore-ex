      responses:
        200:
          description: Assignment attempts ordered by generation
          schema:
            type: array
            items:
              $ref: '#/definitions/RunnerAttempt'

  /project/{project_id}/tasks/{task_id}/raw_output:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/task_id'
    get:
      tags:
        - task
      summary: Get task raw output
      responses:
        200:
          description: output
          headers:
            content-type:
              type: string
