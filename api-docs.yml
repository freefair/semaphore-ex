    properties:
      current_key_id:
        type: string
        pattern: '^swhkid_[-_A-Za-z0-9]+$'
        maxLength: 64
      next_key_id:
        type: string
        pattern: '^swhkid_[-_A-Za-z0-9]+$'
        maxLength: 64
      current_generation:
        type: integer
        minimum: 0
      next_generation:
        type: integer
        minimum: 0
      signing_revision:
        type: integer
        minimum: 0

  AuditWebhookSigningSecret:
    type: object
    description: One-time response. The secret is never returned by status or history reads.
    required: [secret, signing_revision]
    properties:
      secret:
        type: string
        format: password
        pattern: '^swhsec_[-_A-Za-z0-9]+$'
      current_key_id:
        type: string
      next_key_id:
        type: string
      current_generation:
        type: integer
      next_generation:
        type: integer
      signing_revision:
        type: integer

