      responses:
        200:
          description: Updated trigger and one-time signing secret
          schema:
            $ref: '#/definitions/WorkflowTriggerCredentialResult'
        403:
          description: Workflow administration permission required
        409:
          description: Stale revision, invalid signing state, or encryption unavailable

  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/webhook-signing/stage:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/workflow_id'
      - $ref: '#/parameters/trigger_id'
    post:
      tags: [workflow, signed-webhook]
      summary: Stage and reveal the next workflow webhook signing secret once
      parameters:
        - name: revision
          in: body
          required: true
          schema:
            $ref: '#/definitions/WorkflowTriggerRevisionRequest'
      responses:
        200:
          description: Updated trigger and one-time next signing secret
          schema:
            $ref: '#/definitions/WorkflowTriggerCredentialResult'
        403:
          description: Workflow administration permission required
        409:
          description: Stale revision, occupied next-key slot, or encryption unavailable

  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/webhook-signing/promote:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/workflow_id'
      - $ref: '#/parameters/trigger_id'
    post:
      tags: [workflow, signed-webhook]
      summary: Promote a staged workflow webhook key and retain the old key for overlap
      parameters:
        - name: revision
          in: body
          required: true
          schema:
            $ref: '#/definitions/WorkflowTriggerRevisionRequest'
      responses:
        200:
          description: Updated trigger with safe key IDs and generations
          schema:
            $ref: '#/definitions/WorkflowTrigger'
        403:
          description: Workflow administration permission required
        409:
          description: Stale revision or next key is not staged

  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/webhook-signing/revoke:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/workflow_id'
      - $ref: '#/parameters/trigger_id'
    post:
      tags: [workflow, signed-webhook]
      summary: Revoke a staged or retired workflow webhook next key
      parameters:
        - name: revision
          in: body
          required: true
          schema:
            $ref: '#/definitions/WorkflowTriggerRevisionRequest'
      responses:
        200:
          description: Updated trigger with safe key metadata
          schema:
            $ref: '#/definitions/WorkflowTrigger'
        403:
          description: Workflow administration permission required
        409:
          description: Stale revision or invalid signing state

  /project/{project_id}/workflows/{workflow_id}/triggers/{trigger_id}/history:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/workflow_id'
      - $ref: '#/parameters/trigger_id'
    get:
      tags: [workflow, signed-webhook]
      summary: List safe trigger invocation and webhook replay history
      parameters:
        - $ref: '#/parameters/history_count'
        - $ref: '#/parameters/history_before'
      responses:
        200:
          description: Newest safe invocation records first
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/definitions/WorkflowTriggerHistoryEntry'
        403:
          description: Workflow administration permission required

  /workflow-triggers/{project_id}/{workflow_id}/{trigger_id}/webhook:
    parameters:
      - $ref: '#/parameters/project_id'
      - $ref: '#/parameters/workflow_id'
      - $ref: '#/parameters/trigger_id'
    post:
      tags: [signed-webhook]
      summary: Start a workflow from an authenticated, fresh, replay-protected webhook
      description: >-
        The HMAC binds POST, the exact raw path and query, event ID, Unix timestamp,
        key ID, and exact body bytes using the semaphore.webhook.v1 binary framing.
        Every protocol header is required exactly once. Bearer fallback is rejected.
      security: []
      parameters:
        - name: X-Semaphore-Webhook-Version
          in: header
          required: true
          type: string
          enum: [semaphore.webhook.v1]
        - name: X-Semaphore-Event-ID
          in: header
          required: true
          type: string
          minLength: 16
          maxLength: 128
        - name: X-Semaphore-Timestamp
          in: header
          required: true
          type: string
          description: Canonical Unix seconds within five minutes of server UTC time.
        - name: X-Semaphore-Key-ID
          in: header
          required: true
          type: string
          pattern: '^swhkid_[-_A-Za-z0-9]+$'
        - name: X-Semaphore-Signature
          in: header
          required: true
          type: string
          pattern: '^v1=[0-9a-f]{64}$'
        - name: payload
          in: body
          required: true
          schema:
            $ref: '#/definitions/WorkflowTriggerInvocationInput'
      responses:
        201:
          description: Event claimed durably and workflow start recorded
          schema:
            $ref: '#/definitions/WorkflowTriggerFireResult'
        401:
          description: Authentication, signature, key, timestamp, trigger state, or authorization rejected without detail
        409:
          description: Event ID was already claimed; no second workflow is started
        413:
          description: Body exceeds 256 KiB

  /project/{project_id}/workflows/{workflow_id}/run:
    parameters:
      - $ref: "#/parameters/project_id"
      - $ref: "#/parameters/workflow_id"
    post:
      tags:
        - workflow
      summary: Run workflow
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          type: string
          maxLength: 64
          description: Reuses the same workflow attempt when repeated for this workflow
        - name: X-Semaphore-Preflight-Fingerprint
          in: header
          required: false
          type: string
          description: Fingerprint returned by the reviewed workflow preflight
        - name: X-Semaphore-Preflight-Token
          in: header
          required: false
          type: string
          description: Opaque short-lived token returned by the reviewed workflow preflight
      responses:
        201:
          description: workflow run created
          headers:
            Idempotency-Key:
              type: string
              description: Correlation key used for this workflow attempt
          schema:
            $ref: "#/definitions/WorkflowRun"
        409:
          description: Reviewed plan is stale, expired, invalid, or currently denied
          schema:
            $ref: '#/definitions/ExecutionPreflightStale'

  /project/{project_id}/workflows/{workflow_id}/preflight:
    parameters:
      - $ref: "#/parameters/project_id"
      - $ref: "#/parameters/workflow_id"
    post:
      tags:
        - workflow
      summary: Preview a workflow execution plan without starting it
      responses:
        200:
          description: Value-free, provisional workflow execution plan
          schema:
            $ref: '#/definitions/ExecutionPreflightPlan'
        403:
          description: Workflow start permission denied
        404:
          description: Workflow hidden or execution preflight capability unavailable

  /project/{project_id}/workflows/{workflow_id}/runs:
