upstream: 9cd15a7604eb3486134eaa32944d5dcf16a24655
policies:
  local-memory: Exclude journal/generated-rule files from rebuilt trees; preserve local originals and recovery refs.
    Empty resulting commits map to their parent.
  docs-pointer: Retain the historically selected docs revision. The final maintenance commit selects the separately
    reviewed docs update.
  fork-owned: Retain the feature or regression in its existing fork-only namespace; moving it again would not reduce
    overlap with the recorded upstream tree.
  shipped-migration: Retain SQL bytes, numeric registry and ownership ledger at every snapshot. Runtime namespacing
    is a separate design and upgrade task.
  api-fragments: Move new definitions and paths into api-docs-ex.yml at introduction; keep reference entries and
    changes to existing upstream contracts in the main document. Expanded values remain identical.
  locale-boundary: Move added English/German messages into lang/enhanced and merge them at initialization. Preserve
    intentional changes to existing keys and exact merged values.
  selected-summary: Select the Enhanced SQL implementation/factory and EnhancedTaskSummary component; restore the
    corresponding upstream compatibility sources. Preserve implementation bodies and selected behavior tests.
  declaration-or-option-extraction: Extract whole new Go declarations into same-package files or independent Vue
    options into explicit imported spreads. Keep type identity, existing callers, module-local dependencies, initialization
    and host templates intact.
  single-product: Retain removal of commercial runtime/UI and separate-edition delivery. Restoring these changes
    to reduce the diff would change the requested product.
  contract-and-tooling: Retain owned contract checks and feature tooling. The approved API bundler scope provides
    standalone Dredd compatibility; routine syncs still keep helper changes separate.
  existing-test-contract: Keep regression expectations aligned with the selected public interfaces and behavior.
    Preserve baseline failures as failures; extracted tests follow their same-package source.
  authoritative-integration: Retain edits to existing request, serialization, SQL transaction, dispatch, permission,
    admission, redaction, logging or configuration boundaries. Existing upstream declarations remain owned there;
    whole new declarations are extracted where safe.
  host-integration: Retain props, state, lifecycle and template wiring for selected behavior and permissions. New
    independent options are extracted; methods closing over local helpers/constants stay with those bindings.
  published-swagger-contract: Retain this existing public Swagger document and its selected API additions; normalize
    only semantically identical formatting. Replacing it with the broader root API document would change its exposed
    contract.
  build-and-repository-integration: Keep minimal workspace, source-map, selected-product build, Docker, workflow
    and fork-remote integration. Fork-only Task targets move to Taskfile.ex.yml without renaming their public commands.
